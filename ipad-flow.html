<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* every surface reports its own JS errors into the room's diagnostic trail */
(function(){var er=function(p){try{p.page=location.pathname;navigator.sendBeacon('/client-error',JSON.stringify(p))}catch(e){}};
window.addEventListener('error',function(e){er({kind:'error',msg:String(e.message||e),src:String(e.filename||''),line:e.lineno||0})});
window.addEventListener('unhandledrejection',function(e){er({kind:'unhandledrejection',msg:String((e.reason&&e.reason.message)||e.reason)})});
})();
</script>
<meta charset="UTF-8">
<!-- viewport-fit=cover + no user-scaling = a real app surface, not a zoomable web page -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Focus Room, iPad · Guest Flow</title>
<!-- Add-to-Home-Screen → launches standalone (no Safari chrome), portrait, full-bleed.
     navigator.standalone then flips on body.device below to drop the preview bezel. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus Room">
<meta name="theme-color" content="#060605">
<link rel="manifest" href="assets/focusroom.webmanifest">
<link rel="apple-touch-icon" href="assets/app-icon-180.png">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #060605; overflow: hidden; font-family: var(--font-sans); }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(120% 90% at 50% 40%, #121110 0%, #070706 70%, #040403 100%); }
  #room { transform-origin: center center; }

  /* iPad bezel */
  .ipad { position: relative; width: 860px; height: 1216px; border-radius: 62px; padding: 22px;
          background: linear-gradient(150deg, #1a1a1a, #0a0a0a);
          box-shadow: 0 2px 2px rgba(255,255,255,0.05) inset, 0 60px 120px rgba(0,0,0,0.6), 0 10px 40px rgba(0,0,0,0.5);
          border: 1px solid rgba(255,255,255,0.05); }
  .screen { position: relative; width: 816px; height: 1172px; border-radius: 44px; overflow: hidden;
            background: #141414; box-shadow: 0 0 0 2px #000 inset; }
  .camera { position: absolute; top: 33px; left: 50%; transform: translateX(-50%); width: 9px; height: 9px;
            border-radius: 50%; background: #050505; box-shadow: 0 0 0 2px rgba(255,255,255,0.04); z-index: 60; }

  .screenwrap { position: absolute; inset: 0; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.45; } 50% { transform: scale(1.04); opacity: 0.8; } }
  @keyframes breathe { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
  @keyframes cardDrop { from { transform: translateY(-18px); } to { transform: none; } }
  @keyframes introFade { from { opacity: 0; } to { opacity: 1; } }

  /* ============================================================
     CALM MOTION, the iPad should feel alive, never animated AT you.
     Everything here is slow, low-amplitude and opacity/transform only, so it
     reads as the room breathing rather than a slideshow clicking forward.
     Nothing loops fast enough to catch the eye of someone trying to read.
     ============================================================ */
  /* the orb's halo, and the motes drifting off its rim */
  @keyframes orbBreathe { 0%,100% { transform: scale(1); opacity: 0.88; }
                          50%     { transform: scale(1.055); opacity: 1; } }
  @keyframes orbMote {
    0%   { transform: translate(0,0) scale(0.7); opacity: 0; }
    18%  { opacity: 0.75; }
    100% { transform: translate(var(--mx, 14px), -46px) scale(1.5); opacity: 0; } }

  /* a screen arriving: a whisper of a rise, never a slide */
  @keyframes calmIn { from { opacity: 0; transform: translateY(10px); }
                      to   { opacity: 1; transform: none; } }
  /* content settling in sequence, so a screen assembles instead of appearing */
  @keyframes calmLift { from { opacity: 0; transform: translateY(14px); }
                        to   { opacity: 1; transform: none; } }

  /* every screen fades up on arrival */
  .screenwrap > * { animation: calmIn 760ms var(--ease-out) both; }
  /* and its blocks follow, barely staggered, the eye lands on one thing at a time */
  .calm-stagger > * { animation: calmLift 640ms var(--ease-out) both; }
  .calm-stagger > *:nth-child(1) { animation-delay: 60ms; }
  .calm-stagger > *:nth-child(2) { animation-delay: 150ms; }
  .calm-stagger > *:nth-child(3) { animation-delay: 240ms; }
  .calm-stagger > *:nth-child(4) { animation-delay: 330ms; }
  .calm-stagger > *:nth-child(5) { animation-delay: 420ms; }

  /* touch feedback that feels like pressing something soft, not clicking a button */
  button { transition: transform 240ms var(--ease-out), opacity 240ms var(--ease-out); }
  button:active { transform: scale(0.976); }

  /* Someone who asked the system for less motion gets less motion. The room
     still works exactly the same, it just stops moving on its own. */
  @media (prefers-reduced-motion: reduce) {
    .screenwrap > *, .calm-stagger > * { animation: introFade 260ms linear both; }
    [style*="orbBreathe"], [style*="orbMote"] { animation: none !important; }
  }

  /* review controls (outside the iPad), auto-hidden with ?kiosk=1 */
  #controls { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 9px; z-index: 80; background: rgba(20,20,20,0.85); border: 1px solid var(--hair-strong); backdrop-filter: blur(12px);
    border-radius: var(--r-pill); padding: 7px 9px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--fg-muted); transition: opacity var(--dur-base); }
  #controls.hide { opacity: 0; pointer-events: none; }
  #controls button, #controls select { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--hair-strong); border-radius: var(--r-pill); padding: 6px 12px;
    cursor: pointer; transition: all var(--dur-fast); }
  #controls button:hover, #controls select:hover { color: var(--fg-strong); border-color: var(--fg-muted); }
  #controls .sep { width: 1px; height: 16px; background: var(--hair-strong); }
  #controls .now { color: var(--c-signal); }

  /* DEVICE / KIOSK MODE, launched standalone from the iPad home screen, or ?kiosk=1.
     Strip the desktop-preview bezel and let the guest canvas fill the WHOLE display.
     The controller sizes .screen to the real viewport (in pre-scale units) and
     cover-scales #room, so this fills any iPad edge to edge with no letterbox. */
  body.device #stage { background: #060605; }
  body.device .ipad { width: auto; height: auto; padding: 0; border: 0; border-radius: 0;
                      background: none; box-shadow: none; }
  body.device .camera { display: none; }
  body.device .screen { border-radius: 0; box-shadow: none; }
  body.device #controls { display: none !important; }
  /* dvh tracks Safari's disappearing bars; svh/lvh fall back on older iPadOS */
  body.device, body.device html { height: 100dvh; }

  /* ---------------- TURN IT UPRIGHT ----------------
     The room is composed for portrait. Rather than break the layout sideways, one
     calm overlay asks for the turn: a device mark that rotates upright and settles,
     over and over, slowly. No alarm, no red, nothing that reads as an error. */
  #rotate { position: fixed; inset: 0; z-index: 200; display: none;
            align-items: center; justify-content: center; flex-direction: column; gap: 30px;
            background: #060605; text-align: center; padding: 40px; }
  #rotate.on { display: flex; animation: introFade 420ms var(--ease-out) both; }
  #rotate .mark { width: 74px; height: 104px; border-radius: 13px;
                  border: 2px solid var(--c-signal); position: relative;
                  animation: turnUpright 3.4s var(--ease-in-out) infinite; }
  #rotate .mark::after { content: ''; position: absolute; left: 50%; bottom: 8px;
                  transform: translateX(-50%); width: 22px; height: 3px; border-radius: 2px;
                  background: var(--c-signal); opacity: 0.7; }
  #rotate .t { font-family: var(--font-display); font-size: 30px; color: var(--fg-strong);
               letter-spacing: -0.02em; }
  #rotate .s { font-family: var(--font-sans); font-size: 16px; color: var(--fg-muted); max-width: 320px; line-height: 1.5; }
  /* starts on its side, turns upright, rests there, then repeats */
  @keyframes turnUpright {
    0%, 12%   { transform: rotate(-90deg); }
    38%, 78%  { transform: rotate(0deg); }
    100%      { transform: rotate(-90deg); }
  }
  /* while the overlay is up, hold the room still underneath */
  body.landscape #room { filter: blur(2px); opacity: 0.25; }

  @media (prefers-reduced-motion: reduce) {
    #rotate .mark { animation: none; transform: rotate(0deg); }
  }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div id="stage"><div id="room"><div class="ipad"><span class="camera"></span><div class="screen" id="screen"></div></div></div></div>

  <!-- shown only when a guest turns the iPad sideways; the controller toggles .on -->
  <div id="rotate">
    <div class="mark"></div>
    <div class="t">Turn the iPad upright</div>
    <div class="s">The room reads best in portrait. Nothing is lost, your session is waiting.</div>
  </div>

  <div id="controls">
    <button id="btnPrev">‹ Prev</button>
    <span class="now" id="nowStep">welcome</span>
    <button id="btnNext">Next ›</button>
    <span class="sep"></span>
    <select id="jump"></select>
    <span class="sep"></span>
    <button id="btnRestart">Restart</button>
    <button id="btnHide">Hide</button>
  </div>

  <!-- LOCAL-FIRST: the focus-line lib + the esbuild-bundled React app. No CDN,
       no in-browser Babel (Document.pdf change #4). When served inside the app
       the bundle's controller drives the flow from the master clock; opened as a
       file it falls back to manual stepping via the controls above. -->
  <script src="lib/focusline.js"></script>
  <script src="ipad/dist/app.js"></script>
</body>
</html>
