<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../fonts/fonts.css">
<meta charset="UTF-8">
<title>Focus line, email render</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  svg { display: block; }
</style>
</head>
<body>
  <svg id="plot" width="1072" height="400" viewBox="0 0 1072 400" xmlns="http://www.w3.org/2000/svg">
    <line id="baseline" x1="60" y1="0" x2="1012" y2="0" stroke="#141414" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="2 12"/>
    <text x="1012" y="56" text-anchor="end" font-family="'IBM Plex Mono','Courier New',monospace" font-size="17" letter-spacing="2" fill="#A6A49C">HIGH · FOR YOU</text>
    <text x="1012" y="356" text-anchor="end" font-family="'IBM Plex Mono','Courier New',monospace" font-size="17" letter-spacing="2" fill="#A6A49C">LOW · FOR YOU</text>
    <path id="line" d="" fill="none" stroke="#B9A876" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="mark"></g>
  </svg>
  <script src="../../lib/focusline.js"></script>
  <script>
  (function () {
    var NS = 'http://www.w3.org/2000/svg';
    var BOX = { x: 60, y: 60, w: 952, h: 260 };
    document.getElementById('baseline').setAttribute('y1', (BOX.y + BOX.h * (1 - 0.30)).toFixed(1));
    document.getElementById('baseline').setAttribute('y2', (BOX.y + BOX.h * (1 - 0.30)).toFixed(1));
    function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }
    function render(data) {
      // NO SYNTHETIC FALLBACK. This was the one render surface the no-fallback
      // fix missed: with no samples it drew the 'deep' preview curve, and a
      // guest's emailed report carried a line that was not theirs (the
      // 2026-08-31 report artifacts are quarantined for exactly this). No
      // samples means a render ERROR the outputs pipeline must see and skip,
      // never a fabricated line.
      if (!data || !data.samples || !data.samples.length) {
        document.body.setAttribute('data-render-error', 'no-samples');
        return;
      }
      var key = 'session';
      FocusLine.setSamples('session', data.samples, data.troughT != null ? { interruptT: data.troughT } : null);
      document.getElementById('line').setAttribute('d', FocusLine.linePath(key, BOX, { samples: 180 }));
      var trough = (data && data.troughT != null) ? data.troughT : FocusLine.interruptInfo(key).trough;
      var pt = FocusLine.pointAt(key, trough, BOX);
      var g = document.getElementById('mark'); g.innerHTML = '';
      g.appendChild(el('line', { x1: pt.x, y1: pt.y + 12, x2: pt.x, y2: pt.y + 44, stroke: '#FF5714', 'stroke-width': 2 }));
      g.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 8, fill: '#FF5714' }));
      g.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 3.4, fill: '#FFFFFF' }));
      var lab = el('text', { x: pt.x, y: pt.y + 64, fill: '#C2521A', 'font-family': "'Courier New',monospace", 'font-size': 15, 'letter-spacing': 2, 'text-anchor': 'middle' });
      lab.textContent = 'INTERRUPTION'; g.appendChild(lab);
      document.body.setAttribute('data-rendered', '1');
    }
    var q = new URLSearchParams(location.search).get('d');
    if (q) {
      try { render(JSON.parse(decodeURIComponent(escape(atob(q))))); }
      catch (e) { document.body.setAttribute('data-render-error', 'parse-failed'); }
    } else { document.body.setAttribute('data-render-error', 'no-payload'); }
  })();
  </script>
</body>
</html>
