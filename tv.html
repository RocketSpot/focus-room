<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* every surface reports its own JS errors into the room's diagnostic trail */
(function(){var er=function(p){try{p.page=location.pathname;navigator.sendBeacon('/client-error',JSON.stringify(p))}catch(e){}};
window.addEventListener('error',function(e){er({kind:'error',msg:String(e.message||e),src:String(e.filename||''),line:e.lineno||0})});
window.addEventListener('unhandledrejection',function(e){er({kind:'unhandledrejection',msg:String((e.reason&&e.reason.message)||e.reason)})});
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Focus Room, TV</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B0A; overflow: hidden; }
  iframe { border: 0; width: 100vw; height: 100vh; display: block; background: #0B0B0A; }
</style>
</head>
<body>
<!-- The web TV: what Electron's navigateTv() does in the room, done in the
     browser. One shell, one iframe; the shell follows session/state and swaps
     the surface page per beat. Each surface connects its own WS as role 'tv'
     (so the constellation/reveal re-send logic treats it exactly like the
     room's TV window). The shell itself joins as 'tv-shell', a spectator,
     precisely so there is only ONE 'tv' hello per surface load. -->
<iframe id="s" src="tv-constellation.html" allow="autoplay"></iframe>
<script>
  var MAP = { constellation: 'tv-constellation.html', signal: 'tv-signal.html',
    orb: 'tv-orb.html', reveal: 'tv-reveal.html', live: 'tv-live.html' };
  var cur = 'constellation';
  function follow() {
    var ws;
    try {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    } catch (e) { return setTimeout(follow, 1200); }
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: 'client/hello', role: 'tv-shell', t: Date.now() }));
    };
    ws.onmessage = function (ev) {
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.type === 'session/state' && m.surface && MAP[m.surface] && m.surface !== cur) {
        cur = m.surface;
        document.getElementById('s').src = MAP[m.surface];
      }
    };
    ws.onclose = function () { setTimeout(follow, 900); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  follow();
</script>
</body>
</html>
