<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* every surface reports its own JS errors into the room's diagnostic trail */
(function(){var er=function(p){try{p.page=location.pathname;navigator.sendBeacon('/client-error',JSON.stringify(p))}catch(e){}};
window.addEventListener('error',function(e){er({kind:'error',msg:String(e.message||e),src:String(e.filename||''),line:e.lineno||0})});
window.addEventListener('unhandledrejection',function(e){er({kind:'unhandledrejection',msg:String((e.reason&&e.reason.message)||e.reason)})});
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Focus Room, TV · The Reveal</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; font-family: var(--font-sans); }
  /* band colours live in tokens.css (shared with tv-signal + the iPad key) */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #tv {
    position: relative; width: 1920px; height: 1080px; flex: none; transform-origin: center center;
    background:
      radial-gradient(120% 90% at 50% 118%, rgba(221,202,142,0.05), transparent 60%),
      radial-gradient(140% 120% at 50% 50%, #141414 0%, #0B0B0A 70%, #060605 100%);
    overflow: hidden; color: var(--fg);
  }
  .glow { position: absolute; border-radius: 50%; filter: var(--blur-glow); pointer-events: none; }
  .glow.a { width: 1100px; height: 700px; left: 50%; bottom: -360px; transform: translateX(-50%); background: rgba(221,202,142,0.08); }

  .head { position: absolute; top: 76px; left: 120px; right: 120px; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .mark { width: 13px; height: 13px; border-radius: 50%; background: var(--c-signal); box-shadow: 0 0 22px 2px rgba(221,202,142,0.5); }
  .brand .label { color: var(--fg-muted); font-size: 17px; letter-spacing: var(--tr-mono); }
  .head .right { color: var(--fg-muted); font-size: 17px; letter-spacing: var(--tr-mono); font-family: var(--font-mono); text-transform: uppercase; }

  /* ---- the slide grid ----------------------------------------------------
     Everything hangs off two rails: text starts at x=120, the stat column is
     right-aligned to x=1800. Each block owns a FIXED vertical band, so no block
     can ever grow into another one's space (the old bottom-anchored prose grew
     upward through the legend and the region label). */
  .readno { position: absolute; left: 120px; top: 148px; color: var(--c-signal); font-family: var(--font-mono);
            font-size: 18px; letter-spacing: var(--tr-mono); text-transform: uppercase; }
  .title { position: absolute; left: 120px; top: 180px; font-family: var(--font-display); font-weight: 400;
           font-size: 72px; line-height: 1.04; letter-spacing: -0.03em; color: var(--fg-strong); max-width: 1010px; }

  /* the measured figure, the proof, given the weight of a headline */
  .stat { position: absolute; right: 120px; top: 146px; width: 720px; text-align: right; }
  .stat .v { font-family: var(--font-display); font-weight: 400; font-size: 78px; line-height: 1;
             letter-spacing: -0.03em; color: var(--c-signal); white-space: nowrap; }
  .stat.orange .v { color: var(--c-orange); }
  .stat .l { margin-top: 12px; color: var(--fg-muted); font-family: var(--font-mono); font-size: 15px;
             letter-spacing: var(--tr-mono-sm); text-transform: uppercase; }

  svg.plot { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* prose sits in a FIXED band and auto-fits inside it (see fitProse) */
  .prose { position: absolute; left: 120px; top: 806px; width: 1360px; height: 206px; overflow: hidden; }
  .prose .sentence { font-family: var(--font-sans); font-weight: 300; font-size: 28px; line-height: 1.32; color: var(--fg); letter-spacing: -0.01em; }
  .prose .bandnote { margin-top: 12px; font-family: var(--font-sans); font-weight: 300; font-size: 20px; line-height: 1.4; color: var(--fg-muted); }
  .ledger { margin-top: 18px; display: grid; gap: 9px; }
  .ledger.off { display: none; }
  .ledger .row { display: grid; grid-template-columns: 148px 1fr; gap: 24px; align-items: baseline; }
  .ledger .k { font-family: var(--font-mono); font-size: 14px; letter-spacing: var(--tr-mono); text-transform: uppercase; color: var(--fg-faint); }
  .ledger .said { font-family: var(--font-sans); font-weight: 300; font-size: 20px; color: var(--fg-muted); font-style: italic; }
  .ledger .did { font-family: var(--font-sans); font-weight: 400; font-size: 20px; color: var(--fg-strong); }

  /* slide-change motion: the text lifts in, it never just pops */
  .anim { animation: riseIn 620ms var(--ease-out) both; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .readdots { position: absolute; right: 120px; bottom: 66px; display: flex; gap: 14px; align-items: center; }
  .readdots .d { width: 10px; height: 10px; border-radius: 50%; background: var(--hair-strong); transition: all var(--dur-base); }
  .readdots .d.on { background: var(--c-signal); box-shadow: 0 0 14px 1px rgba(221,202,142,0.5); transform: scale(1.15); }
  .readdots .d.done { background: var(--fg-muted); }
  .readdots .ring { width: 30px; height: 30px; margin-right: 6px; }

  #controls { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center;
    gap: 10px; z-index: 50; background: rgba(20,20,20,0.82); border: 1px solid var(--hair-strong);
    backdrop-filter: blur(12px); border-radius: var(--r-pill); padding: 8px 10px; font-family: var(--font-mono);
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); }
  #controls.hide { opacity: 0; pointer-events: none; }
  #controls button, #controls select { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--fg); background: transparent; border: 1px solid var(--hair-strong);
    border-radius: var(--r-pill); padding: 7px 13px; cursor: pointer; }
  #controls .sep { width: 1px; height: 18px; background: var(--hair-strong); }
  #controls .hint { color: var(--fg-faint); padding: 0 4px; }

  /* the post-scan processing moment */
  .processing { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; background: radial-gradient(120% 90% at 50% 50%, #141414 0%, #0B0B0A 72%); z-index: 20; }
  .processing.on { display: flex; animation: fadeIn 500ms var(--ease-out) both; }
  .processing.out { animation: fadeOut 500ms var(--ease-in-out) both; }
  .processing .pmark { width: 18px; height: 18px; border-radius: 50%; background: var(--c-signal);
    box-shadow: 0 0 40px 6px rgba(221,202,142,0.45); animation: pbreathe 2.2s var(--ease-in-out) infinite; }
  .processing .phead { font-family: var(--font-display); font-weight: 400; font-size: 52px; letter-spacing: -0.02em; color: var(--fg-strong); }
  .processing .psub { font-family: var(--font-mono); font-size: 17px; letter-spacing: var(--tr-mono-sm); text-transform: uppercase; color: var(--fg-muted); }
  @keyframes pbreathe { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.35); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
  <div id="stage">
    <div id="tv">
      <div class="glow a"></div>
      <div class="head">
        <div class="brand"><span class="mark"></span><span class="label">ZONE, THE FOCUS ROOM</span></div>
        <div class="right">The Reveal</div>
      </div>

      <div class="readno" id="readno">READ 01 / 04</div>
      <h1 class="title" id="title">How you settled</h1>
      <div class="stat" id="stat"><div class="v" id="statV"></div><div class="l" id="statL"></div></div>

      <svg class="plot" id="plot" viewBox="0 0 1920 1080">
        <defs>
          <filter id="soft" x="-8%" y="-40%" width="116%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <g id="grid"></g>
        <g id="gaps"></g>
        <g id="bandGlows"></g>
        <g id="bandLines"></g>
        <g id="labels"></g>
        <g id="spot"></g>
        <g id="timeline"></g>
        <g id="anno"></g>
      </svg>

      <div class="prose" id="prose">
        <div class="sentence" id="sentence">, </div>
        <div class="bandnote" id="bandnote"></div>
        <div class="ledger off" id="ledger">
          <div class="row"><div class="k">You said</div><div class="said" id="said">, </div></div>
          <div class="row"><div class="k">Your reading</div><div class="did" id="did">, </div></div>
        </div>
      </div>

      <div class="readdots" id="readdots"></div>

      <!-- the post-scan processing moment: shown while the room reads the session -->
      <div class="processing" id="processing">
        <div class="pmark"></div>
        <div class="phead">Reading your session</div>
        <div class="psub">Cleaning the signal, shaping what your rhythms did</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="btnAuto">Pause auto</button>
    <button id="btnPrev">Prev</button>
    <button id="btnNext">Next</button>
    <span class="sep"></span>
    <span class="hint">Beat</span>
    <select id="selBeat">
      <option value="8">8s (demo)</option>
      <option value="60" selected>60s (real)</option>
      <option value="4">4s (fast)</option>
    </select>
    <span class="sep"></span>
    <button id="btnHide">Hide</button>
  </div>

  <script src="lib/focusline.js"></script>
  <script>
  (function () {
    var tv = document.getElementById('tv');
    function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); tv.style.transform = 'scale(' + s + ')'; }
    window.addEventListener('resize', fit); fit();

    var NS = 'http://www.w3.org/2000/svg';
    var FL = window.FocusLine;
    // plot box, with the right margin reserved for the inline series labels
    var BOX = { x: 150, y: 316, w: 1330, h: 372 };
    var LBLX = BOX.x + BOX.w + 26;
    // the vertical stack below the plot, laid out once so nothing can collide:
    // time axis → reading ribbon → event timeline → prose (fixed band in CSS)
    var AXISY = BOX.y + BOX.h + 26;   // 714 · time labels
    var RIBY  = BOX.y + BOX.h + 56;   // 744 · baseline of the reading-pace ribbon
    var TLY   = BOX.y + BOX.h + 74;   // 762 · the event timeline
    var BANDS = [
      { k: 'delta', gl: 'δ', nm: 'Delta', ds: 'slow waves',       col: 'var(--w-delta)' },
      { k: 'theta', gl: 'θ', nm: 'Theta', ds: 'internal thinking', col: 'var(--w-theta)' },
      { k: 'alpha', gl: 'α', nm: 'Alpha', ds: 'relaxed alertness', col: 'var(--w-alpha)' },
      { k: 'beta', gl: 'β', nm: 'Beta', ds: 'focused thinking', col: 'var(--w-beta)' },
      { k: 'gamma', gl: 'γ', nm: 'Gamma', ds: 'peak processing',  col: 'var(--w-gamma)' }
    ];
    function el(tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); return e; }
    function mean(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return a.length? s/a.length : 0; }
    function pctl(sorted, p) { if(!sorted.length) return 0; var i=Math.min(sorted.length-1,Math.max(0,Math.round((sorted.length-1)*p))); return sorted[i]; }
    function fmtClock(sec){ var s=Math.round(sec); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

    var glowG = document.getElementById('bandGlows'), lineG = document.getElementById('bandLines');
    var labelG = document.getElementById('labels'), gridG = document.getElementById('grid');
    var gapG = document.getElementById('gaps');
    var bandPathEls = {};
    BANDS.forEach(function(b){
      var g = el('path', { fill:'none', stroke:b.col, 'stroke-opacity':0.16, 'stroke-width':9, 'stroke-linecap':'round','stroke-linejoin':'round', filter:'url(#soft)' });
      g.style.transition = 'stroke-opacity 500ms var(--ease-in-out)';
      glowG.appendChild(g);
      var l = el('path', { fill:'none', stroke:b.col, 'stroke-opacity':0.92, 'stroke-width':3.2, 'stroke-linecap':'round','stroke-linejoin':'round' });
      l.style.transition = 'stroke-opacity 500ms var(--ease-in-out), stroke-width 500ms var(--ease-in-out)';
      lineG.appendChild(l);
      bandPathEls[b.k] = { glow:g, line:l, lbl:null };
    });

    var bandStream = [];   // [{t, delta..gamma}]
    var R = [];            // reads
    var interruptT = 0.6;
    var sessionSec = 0;    // reading length in seconds, for the time axis
    var scrollTrack = [];  // [{t, p}] reading progress 0..1, when the iPad reported it
    var gaps = [];         // [{from, to}] stream seconds with no signal at all (a dropout)

    // ---------------------------------------------------------------
    // THE CHART
    // ---------------------------------------------------------------
    // Real band power is 1/f: delta carries tens of percent of the signal and
    // gamma a fraction of one percent, so the five bands span roughly two
    // decades. The old chart threw that away, it normalised each band to its
    // own range and parked it in a fixed lane, which made five unrelated
    // squiggles of identical amplitude and told the guest nothing.
    //
    // Now: each sample is converted to each band's SHARE of that moment's total
    // signal power (which is what the sidecar measures), all five are plotted
    // against ONE log axis, and the axis is labelled in percent. The 1/f
    // ordering falls out of the data, the lines separate naturally, and every
    // gridline is a real quantity the guest can read.
    //
    // Band power is an ENVELOPE, not a waveform: computed on ~1s epochs and
    // conventionally smoothed further, it undulates over tens of seconds. We
    // apply a centred moving average so the plotted line is the envelope rather
    // than sample-to-sample jitter, and draw it with monotone curves so it can
    // never bulge past its own samples.
    var scale = null;
    function movAvg(a, w) {
      if (w < 2) return a.slice();
      var out = [], half = Math.floor(w / 2);
      for (var i = 0; i < a.length; i++) {
        var s = 0, c = 0;
        for (var j = Math.max(0, i - half); j <= Math.min(a.length - 1, i + half); j++) { s += a[j]; c++; }
        out.push(s / c);
      }
      return out;
    }
    var SMOOTH_SEC = 10;          // envelope smoothing window (physical time)
    var CHART_FLOOR = 0.03;       // bands under 3% session share sit at the axis floor, not magnified
    function buildScale() {
      scale = null;
      if (bandStream.length < 4) return;
      // A recording can OPEN on a stray pre-anchor row (t≈2.4, then the clock
      // restarts at 0). The path started at x(2.4s), jumped back to x(0), and
      // drew over itself, a little fork on every band's left edge. Trim any
      // leading rows that sit before a clock restart.
      var rows = bandStream, cut = 0;
      for (var ci = 1; ci < Math.min(rows.length, 12); ci++) if (rows[ci].t < rows[ci-1].t - 1e-6) cut = ci;
      if (cut) rows = rows.slice(cut);
      if (rows.length < 4) return;
      // MERGE the L/R samples that land at the same instant. They arrive as pairs
      // (dt≈0 then ≈1-2s), and plotting both created vertical steps, the
      // staircase. Averaging them into one moment gives a clean ~1Hz envelope.
      var merged = [];
      for (var mi = 0; mi < rows.length; mi++) {
        var s = rows[mi], last = merged[merged.length-1];
        if (last && isFinite(s.t) && isFinite(last.t) && Math.abs(s.t - last.t) < 0.4) {
          BANDS.forEach(function(b){ last[b.k] = (last[b.k]*last._n + (+s[b.k]||0)) / (last._n+1); }); last._n++;
        } else {
          var o = { t: s.t, _n: 1 }; BANDS.forEach(function(b){ o[b.k] = Math.max(0, +s[b.k]||0); }); merged.push(o);
        }
      }
      var n = merged.length;
      if (n < 4) return;
      var lastT = merged[n-1].t;
      var useT = isFinite(lastT) && lastT > 0;
      sessionSec = useT ? lastT : 0;
      // share of each moment's total power
      var shares = {}, sessMed = {};
      BANDS.forEach(function(b){ shares[b.k] = []; });
      for (var i = 0; i < n; i++) {
        var tot = 0;
        BANDS.forEach(function(b){ tot += Math.max(0, +merged[i][b.k] || 0); });
        tot = tot || 1e-9;
        BANDS.forEach(function(b){ shares[b.k].push(Math.max(0, +merged[i][b.k] || 0) / tot); });
      }
      // smooth on a PHYSICAL window, not a sample count, a short/sparse read
      // under-smoothed into a staircase before
      var dt = (useT && n > 1) ? (lastT / (n-1)) : 1;
      var win = Math.max(3, Math.round(SMOOTH_SEC / Math.max(dt, 0.4)));
      BANDS.forEach(function(b){ shares[b.k] = movAvg(shares[b.k], win); });
      BANDS.forEach(function(b){ var s = shares[b.k].slice().sort(function(a,c){return a-c;}); sessMed[b.k] = pctl(s, 0.5); });
      // Domain from the SUPPORTABLE bands only, and floored. Pooling every band's
      // shares let the noise-floor bands (gamma, ~0.3%) set the axis bottom, so on
      // a log scale a meaningless gamma wiggle took a third of the plot height
      // while delta, the band with real signal, got a sliver. Now the floor is
      // a real share, and bands below it rest at the bottom instead of ballooning.
      var all = [];
      BANDS.forEach(function(b){ if (sessMed[b.k] >= CHART_FLOOR) shares[b.k].forEach(function(v){ if (v > 0) all.push(v); }); });
      if (all.length < 8) { BANDS.forEach(function(b){ shares[b.k].forEach(function(v){ if (v>0) all.push(v); }); }); }
      if (all.length < 8) return;
      all.sort(function(a,b){ return a-b; });
      var lo = Math.max(pctl(all, 0.05), CHART_FLOOR * 0.6), hi = Math.max(pctl(all, 0.99), lo * 1.5);
      var log = (hi / lo) > 12;                      // clear multi-decade spread → log
      var d0 = log ? Math.log10(lo) : lo, d1 = log ? Math.log10(hi) : hi;
      var pad = (d1 - d0) * 0.08; d0 -= pad; d1 += pad;
      scale = {
        log: log, d0: d0, d1: d1, useT: useT, totalT: useT ? lastT : 1, n: n, shares: shares, merged: merged,
        yOf: function (v) {
          var m = this.log ? Math.log10(Math.max(v, 1e-6)) : v;
          var f = (m - this.d0) / ((this.d1 - this.d0) || 1);
          return BOX.y + BOX.h * (1 - Math.max(0, Math.min(1, f)));
        },
        xOf: function (i) {
          var f = this.useT && isFinite(this.merged[i].t) ? this.merged[i].t / this.totalT : (this.n > 1 ? i / (this.n - 1) : 0);
          return BOX.x + BOX.w * Math.max(0, Math.min(1, f));
        }
      };
    }

    function drawAxes() {
      gridG.innerHTML = '';
      if (!scale) return;
      // Value axis: real percentages of the guest's own signal power. The
      // candidate list is dense enough that a NARROW domain (a session where all
      // five bands sit between 8% and 40%) still gets several labelled lines,
      // a decade-only list left such a chart with two ticks on it.
      var CAND = [0.002,0.003,0.005,0.007,0.01,0.015,0.02,0.03,0.05,0.07,0.1,0.15,0.2,0.3,0.5,0.7];
      var inside = CAND.filter(function(v){ var y = scale.yOf(v); return y >= BOX.y + 8 && y <= BOX.y + BOX.h - 8; });
      while (inside.length > 7) inside = inside.filter(function(_, i){ return i % 2 === 0; });
      var shown = 0;
      inside.forEach(function(v){
        var y = scale.yOf(v);
        if (y < BOX.y + 8 || y > BOX.y + BOX.h - 8) return;
        shown++;
        gridG.appendChild(el('line', { x1:BOX.x, x2:BOX.x+BOX.w, y1:y, y2:y, stroke:'var(--hair)', 'stroke-width':1, 'stroke-dasharray':'2 12' }));
        var t = el('text', { x:BOX.x-16, y:y+5, fill:'var(--fg-faint)', 'text-anchor':'end',
          'font-family':'var(--font-mono)', 'font-size':14, 'letter-spacing':'1.2' });
        t.textContent = (v*100 >= 1 ? Math.round(v*100) : (v*100).toFixed(1)) + '%';
        gridG.appendChild(t);
      });
      if (shown) {
        // left-aligned to the plot's own left rail. Right-anchoring it to the
        // axis ran the caption off the left edge of the screen.
        var cap = el('text', { x:BOX.x, y:BOX.y-16, fill:'var(--fg-faint)',
          'font-family':'var(--font-mono)', 'font-size':12, 'letter-spacing':'2' });
        cap.textContent = 'RELATIVE BAND POWER';
        gridG.appendChild(cap);
      }
      // time axis in minutes, so the guest can place every read on a clock
      if (sessionSec > 20) {
        var step = sessionSec > 480 ? 120 : (sessionSec > 240 ? 60 : 30);
        for (var s = 0; s <= sessionSec + 0.5; s += step) {
          var x = BOX.x + BOX.w * (s / sessionSec);
          if (x > BOX.x + BOX.w) break;
          gridG.appendChild(el('line', { x1:x, x2:x, y1:BOX.y+BOX.h, y2:BOX.y+BOX.h+7, stroke:'var(--hair-strong)', 'stroke-width':1 }));
          var tt = el('text', { x:x, y:AXISY, fill:'var(--fg-faint)', 'text-anchor':'middle',
            'font-family':'var(--font-mono)', 'font-size':14, 'letter-spacing':'1.4' });
          tt.textContent = fmtClock(s);
          gridG.appendChild(tt);
        }
      }
    }

    // Split a band's points into the runs that lie BETWEEN dropouts. A sample
    // whose stream time falls inside a recorded gap is not plotted at all.
    function runsBetweenGaps(pix) {
      if (!scale) return [pix];
      // A real dropout leaves NO rows inside the gap, so testing whether a row
      // falls inside one can never break the path: times jump from one side of
      // the hole to the other, and the line was drawn straight across, smoothed
      // and confident, through a stretch where there was nothing to draw. So
      // ALSO break wherever consecutive rows sit further apart than a live
      // stream can produce. A disconnection now reads as a blank stretch.
      var GAP_BREAK_SEC = 4.5;   // the stream hops ~1s; 4.5 is unambiguous death
      var prevT = null;
      var runs = [], cur = [];
      for (var i = 0; i < pix.length; i++) {
        // pix is indexed on the MERGED rows (buildScale averages L/R pairs and
        // trims pre-anchor rows), indexing raw bandStream here read a
        // timestamp about half the real time, so line breaks landed at the
        // wrong x and real dropouts could be drawn straight through.
        var t = scale.merged[i] && isFinite(scale.merged[i].t) ? scale.merged[i].t : null;
        var inGap = false;
        if (t != null) {
          for (var g = 0; g < gaps.length; g++) {
            if (t > gaps[g].from && t < gaps[g].to) { inGap = true; break; }
          }
        }
        var jumped = (t != null && prevT != null && (t - prevT) > GAP_BREAK_SEC);
        if (inGap || jumped) { if (cur.length) { runs.push(cur); cur = []; } }
        if (!inGap) cur.push(pix[i]);
        if (t != null) prevT = t;
      }
      if (cur.length) runs.push(cur);
      return runs.length ? runs : [pix];
    }

    // Mark each dropout on the plot so the break reads as "we lost the signal
    // here", not as a rendering glitch.
    function drawGaps() {
      gapG.innerHTML = '';
      if (!gaps.length || !scale || !sessionSec) return;
      gaps.forEach(function(g){
        var x0 = BOX.x + BOX.w * Math.max(0, Math.min(1, g.from / sessionSec));
        var x1 = BOX.x + BOX.w * Math.max(0, Math.min(1, g.to / sessionSec));
        if (x1 - x0 < 1) return;
        gapG.appendChild(el('rect', { x:x0, y:BOX.y, width:x1-x0, height:BOX.h,
          fill:'var(--fg-faint)', 'fill-opacity':0.05 }));
        [x0, x1].forEach(function(x){
          gapG.appendChild(el('line', { x1:x, x2:x, y1:BOX.y, y2:BOX.y+BOX.h,
            stroke:'var(--fg-faint)', 'stroke-opacity':0.3, 'stroke-width':1, 'stroke-dasharray':'2 6' }));
        });
        // no words on a gap: a label here is a signal verdict, and the room never
        // gives a guest one. The blank stretch with dashed edges says it wordlessly.
      });
    }

    function drawBands() {
      buildScale();
      if (!scale) {
        BANDS.forEach(function(b){ bandPathEls[b.k].glow.setAttribute('d',''); bandPathEls[b.k].line.setAttribute('d',''); });
        labelG.innerHTML = ''; gridG.innerHTML = '';
        return;
      }
      drawAxes();
      drawGaps();
      var ends = [];
      BANDS.forEach(function(b){
        var pix = scale.shares[b.k].map(function(v, i){ return { x: scale.xOf(i), y: scale.yOf(v) }; });
        // BREAK the line across a dropout. Bluetooth drops mid-session, and a
        // smooth curve drawn straight through the hole is the most confident
        // thing on the chart while being the one stretch where nothing was
        // recorded at all. Each run of real samples gets its own subpath.
        var d = runsBetweenGaps(pix).map(function(seg){
          return seg.length > 1 ? FL.smooth(seg) : '';
        }).filter(Boolean).join(' ');
        bandPathEls[b.k].glow.setAttribute('d', d);
        bandPathEls[b.k].line.setAttribute('d', d);
        ends.push({ b: b, y: pix[pix.length-1].y, share: scale.shares[b.k][scale.n-1] });
      });
      drawSeriesLabels(ends);
      animateDrawIn();
    }

    // Inline series labels at the right end of each line, so a guest never has
    // to match a colour swatch in a legend to a line in a chart. Labels are
    // pushed apart when two bands finish close together.
    function drawSeriesLabels(ends) {
      labelG.innerHTML = '';
      ends.sort(function(a,b){ return a.y - b.y; });
      var GAP = 46, top = BOX.y - 6, bot = BOX.y + BOX.h + 6;
      for (var i = 0; i < ends.length; i++) {
        ends[i].ly = Math.max(top + i * GAP, Math.min(ends[i].y, bot - (ends.length - 1 - i) * GAP));
        if (i > 0 && ends[i].ly - ends[i-1].ly < GAP) ends[i].ly = ends[i-1].ly + GAP;
      }
      ends.forEach(function(e){
        var g = el('g', {});
        g.style.transition = 'opacity 500ms var(--ease-in-out)';
        // a short leader from the line's true end to its (possibly nudged) label
        g.appendChild(el('path', { d: 'M '+(BOX.x+BOX.w+4)+' '+e.y.toFixed(1)+' L '+(LBLX-10)+' '+e.ly.toFixed(1),
          fill:'none', stroke:e.b.col, 'stroke-opacity':0.35, 'stroke-width':1.4 }));
        var gl = el('text', { x:LBLX, y:e.ly+8, fill:e.b.col, 'font-family':'var(--font-display)', 'font-size':26 });
        gl.textContent = e.b.gl; g.appendChild(gl);
        var nm = el('text', { x:LBLX+34, y:e.ly+2, fill:'var(--fg-strong)', 'font-family':'var(--font-mono)', 'font-size':15, 'letter-spacing':'1.8' });
        nm.textContent = e.b.nm.toUpperCase(); g.appendChild(nm);
        var ds = el('text', { x:LBLX+34, y:e.ly+20, fill:'var(--fg-faint)', 'font-family':'var(--font-mono)', 'font-size':12, 'letter-spacing':'1.4' });
        ds.textContent = e.b.ds.toUpperCase(); g.appendChild(ds);
        labelG.appendChild(g);
        bandPathEls[e.b.k].lbl = g;
      });
    }

    // the lines draw themselves in, left to right, once per session
    function animateDrawIn() {
      BANDS.forEach(function(b, i){
        var p = bandPathEls[b.k].line, len;
        try { len = p.getTotalLength(); } catch (e) { return; }
        if (!len) return;
        p.style.transition = 'none';
        p.setAttribute('stroke-dasharray', len);
        p.setAttribute('stroke-dashoffset', len);
        // eslint-disable-next-line no-unused-expressions
        p.getBoundingClientRect();
        p.style.transition = 'stroke-dashoffset 1700ms var(--ease-out) ' + (i*70) + 'ms, stroke-opacity 500ms var(--ease-in-out), stroke-width 500ms var(--ease-in-out)';
        p.setAttribute('stroke-dashoffset', 0);
      });
    }

    // ---------------------------------------------------------------
    // SPOTLIGHT + TIMELINE
    // ---------------------------------------------------------------
    // The two dim panels are created ONCE and animated between reads. Rebuilding
    // them every slide is what made the box flicker, land misaligned, and
    // sometimes not appear at all.
    var spot = document.getElementById('spot'), anno = document.getElementById('anno'), tlG = document.getElementById('timeline');

    var dimL = el('rect', { x:BOX.x-2, y:BOX.y-6, width:0, height:BOX.h+12, fill:'rgba(6,6,5,0.5)' });
    var dimR = el('rect', { x:BOX.x+BOX.w+2, y:BOX.y-6, width:0, height:BOX.h+12, fill:'rgba(6,6,5,0.5)' });

    // read as a smudge over the chart; a faint tint inside the window plus a
    // bright edge on each boundary makes it obvious the box is pointing at
    // something, and it survives on both light and dark stretches of the plot.
    var focusFill = el('rect', { x:BOX.x, y:BOX.y-6, width:0, height:BOX.h+12, fill:'var(--c-signal)', 'fill-opacity':0.045 });
    var edgeA = el('line', { x1:BOX.x, x2:BOX.x, y1:BOX.y-6, y2:BOX.y+BOX.h+6, stroke:'var(--c-signal)', 'stroke-opacity':0.5, 'stroke-width':1.5 });
    var edgeB = el('line', { x1:BOX.x, x2:BOX.x, y1:BOX.y-6, y2:BOX.y+BOX.h+6, stroke:'var(--c-signal)', 'stroke-opacity':0.5, 'stroke-width':1.5 });
    [dimL, dimR, focusFill].forEach(function(r){ r.style.transition = 'x 620ms var(--ease-in-out), width 620ms var(--ease-in-out)'; spot.appendChild(r); });
    [edgeA, edgeB].forEach(function(l){ l.style.transition = 'x1 620ms var(--ease-in-out), x2 620ms var(--ease-in-out), stroke 400ms'; spot.appendChild(l); });

    function drawTimeline() {

        tlG.appendChild(seg);
        if (!on) return;
