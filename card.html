<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Focus Room — Printed Card</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; background: #2A2926; font-family: var(--font-sans); }
  #page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 48px 20px; }
  /* the card — 4×6in @ 100px/in for screen; print rules below */
  .card-shadow { box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 6px 20px rgba(0,0,0,0.4); border-radius: 6px; }
  svg.card { display: block; width: 400px; height: 600px; border-radius: 6px; background: var(--c-offwhite); }
  .controls { display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.3); border: 1px solid var(--hair-strong);
    border-radius: var(--r-pill); padding: 7px 9px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--fg-muted); }
  .controls button, .controls select { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--hair-strong); border-radius: var(--r-pill); padding: 6px 12px; cursor: pointer; }
  .controls button:hover { color: var(--fg-strong); }
  .hint { color: var(--fg-faint); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  @media print {
    @page { size: 4in 6in; margin: 0; }
    html, body { background: #fff; }
    #page { padding: 0; min-height: auto; }
    .controls, .hint { display: none !important; }
    .card-shadow { box-shadow: none; border-radius: 0; }
    svg.card { width: 4in; height: 6in; border-radius: 0; }
  }
</style>
</head>
<body>
  <div id="page">
    <div class="hint">Printed card · 4 × 6 in · home-printer safe (no bleed) · ⌘P to print</div>
    <div class="card-shadow">
      <svg class="card" id="card" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
        <!-- header -->
        <text x="36" y="52" class="t-mono" fill="#7A7873" font-family="IBM Plex Mono" font-size="9" letter-spacing="1.6" style="text-transform:uppercase">THE FOCUS ROOM</text>
        <text x="364" y="52" text-anchor="end" fill="#7A7873" font-family="IBM Plex Mono" font-size="9" letter-spacing="1.6" id="slot-date">07/15/2026</text>

        <!-- archetype -->
        <text x="35" y="150" fill="#7A7873" font-family="IBM Plex Mono" font-size="9" letter-spacing="2.2">IN YOUR SESSION TODAY</text>
        <text x="33" y="206" id="slot-archetype" fill="#141414" font-family="PP Neue Montreal, Space Grotesk, Helvetica Neue, Arial" font-weight="500" font-size="50" letter-spacing="-1.6">Deep Diver</text>

        <!-- focus line region -->
        <g id="focus-line"><!-- line + interruption mark injected at runtime --></g>

        <!-- one-sentence meaning -->
        <text x="35" y="488" id="slot-caption" fill="#1E1D1C" font-family="Inter" font-weight="300" font-size="16">
          <tspan x="35" dy="0">Slow to settle, then long and deep. One</tspan>
          <tspan x="35" dy="23">interruption pulled you down hard — and you</tspan>
          <tspan x="35" dy="23">took your time climbing back.</tspan>
        </text>

        <!-- Zone wordmark (z•ne) — vector logo, native 493×128 at ~10px tall (the old text mark's size) -->
        <g transform="translate(35,556) scale(0.082)">
          <path fill="#141414" fill-rule="nonzero" d="M370.719 64.244 C370.719 51.379 373.236 40.142 378.271 30.534 C383.467 20.763 390.612 13.272 399.706 8.061 C408.963 2.687 419.518 0 431.373 0 C443.389 0 453.945 2.443 463.039 7.328 C472.295 12.214 479.522 19.135 484.718 28.092 C490.077 37.048 492.838 47.552 493 59.603 C493 62.86 492.756 66.198 492.269 69.618 L398.245 69.618 L398.245 71.084 C398.894 81.995 402.305 90.626 408.475 96.977 C414.646 103.328 422.847 106.504 433.078 106.504 C441.197 106.504 448.018 104.631 453.539 100.885 C458.861 97.118 462.448 91.913 464.3 85.27 C464.423 84.83 464.82 84.519 465.277 84.519 L489.613 84.519 C490.236 84.519 490.707 85.082 490.585 85.693 C488.148 97.865 482.052 107.896 472.295 115.786 C462.389 123.929 449.966 128 435.026 128 C422.035 128 410.668 125.394 400.924 120.183 C391.343 114.809 383.873 107.318 378.514 97.71 C373.318 88.102 370.719 76.947 370.719 64.244 Z M466.205 50.321 C465.069 41.201 461.415 34.117 455.244 29.069 C449.236 23.858 441.603 21.252 432.347 21.252 C423.74 21.252 416.27 23.939 409.937 29.313 C403.766 34.524 400.193 41.527 399.219 50.321 L466.205 50.321 Z M301.134 0 C315.912 0 327.929 4.56 337.185 13.679 C346.604 22.799 353.923 34.843 353.923 55.037 L353.923 125.534 C353.923 126.087 353.475 126.534 352.923 126.534 L325.762 126.534 C325.21 126.534 324.762 126.087 324.762 125.534 L324.762 59.115 C324.762 47.226 322.245 38.188 317.211 32 C312.177 25.812 304.788 22.718 295.044 22.718 C284.651 22.718 276.451 26.382 270.442 33.71 C264.596 40.875 261.673 50.809 261.673 63.511 L261.673 125.534 C261.673 126.087 261.225 126.534 260.673 126.534 L236.366 126.534 C235.813 126.534 235.366 126.087 235.366 125.534 L235.366 2.466 C235.366 1.913 235.813 1.466 236.366 1.466 L257.426 1.466 C257.91 1.466 258.325 1.813 258.41 2.29 L261.186 17.832 C270.604 5.944 283.921 0 301.134 0 Z M2.923 2.466 C2.923 1.913 3.371 1.466 3.923 1.466 L103.986 1.466 C104.538 1.466 104.986 1.913 104.986 2.466 L104.986 19.547 C104.986 20.017 104.82 20.472 104.518 20.832 L35.32 103.328 L107.153 103.328 C107.705 103.328 108.153 103.776 108.153 104.328 L108.153 125.534 C108.153 126.087 107.705 126.534 107.153 126.534 L1 126.534 C0.448 126.534 0 126.087 0 125.534 L0 108.453 C0 107.983 0.166 107.528 0.468 107.168 L69.666 24.672 L3.923 24.672 C3.371 24.672 2.923 24.224 2.923 23.672 L2.923 2.466 Z M202.53 64 C202.53 83.146 187.019 98.667 167.886 98.667 C148.754 98.667 133.243 83.146 133.243 64 C133.243 44.854 148.754 29.333 167.886 29.333 C187.019 29.333 202.53 44.854 202.53 64 Z"/>
        </g>
        <text x="364" y="565" text-anchor="end" fill="#7A7873" font-family="IBM Plex Mono" font-size="8" letter-spacing="1.6">A SINGLE READING</text>

        <!-- faint corner dots -->
        <circle cx="22" cy="22" r="1.4" fill="#7A7873" opacity="0.4"/>
        <circle cx="378" cy="22" r="1.4" fill="#7A7873" opacity="0.4"/>
        <circle cx="22" cy="578" r="1.4" fill="#7A7873" opacity="0.4"/>
        <circle cx="378" cy="578" r="1.4" fill="#7A7873" opacity="0.4"/>
      </svg>
    </div>
    <div class="controls">
      <span class="hint" style="color:var(--fg-faint)">Archetype</span>
      <select id="selArch">
        <option value="deep">Deep Diver</option>
        <option value="igniter">Quick Igniter</option>
        <option value="steady">Steady Burner</option>
        <option value="sprint">Sprinter</option>
      </select>
      <button onclick="window.print()">Print</button>
    </div>
  </div>

  <script src="lib/focusline.js"></script>
  <script>
  (function () {
    var NS = 'http://www.w3.org/2000/svg';
    var BOX = { x: 35, y: 268, w: 330, h: 150 };
    var COPY = {
      deep:    { name: 'Deep Diver', caption: ['Slow to settle, then long and deep. One', 'interruption pulled you down hard — and you', 'took your time climbing back.'] },
      igniter: { name: 'Quick Igniter', caption: ['You dropped in fast and ran in short waves.', 'The interruption knocked you down — but you', 'were back almost before it landed.'] },
      steady:  { name: 'Steady Burner', caption: ['Even focus, start to finish. Gentle waves,', 'little drift. The interruption barely moved', 'you, and you held your line.'] },
      sprint:  { name: 'Sprinter', caption: ['Intense, restless, all peaks and troughs.', 'The interruption hit hard and you snapped', 'back just as sharply.'] }
    };

    function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); return e; }

    function render(arch, data) {
      // real session data (injected via ?d=) feeds FocusLine; else synthetic preview
      var lineKey = arch;
      if (data && data.samples && data.samples.length) {
        FocusLine.setSamples('session', data.samples, data.troughT != null ? { interruptT: data.troughT } : null);
        lineKey = 'session';
      }
      var name = (data && data.name) || COPY[arch].name;
      var caption = (data && data.caption) || COPY[arch].caption;

      var g = document.getElementById('focus-line'); g.innerHTML = '';
      var baseY = BOX.y + BOX.h * (1 - 0.30);
      g.appendChild(el('line', { x1: BOX.x, y1: baseY, x2: BOX.x + BOX.w, y2: baseY, stroke: '#141414', 'stroke-opacity': 0.12, 'stroke-width': 1, 'stroke-dasharray': '1 7' }));
      g.appendChild(el('path', { d: FocusLine.linePath(lineKey, BOX, { samples: 160 }), fill: 'none', stroke: '#141414', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
      // interruption mark at the real trough
      var trough = (data && data.troughT != null) ? data.troughT : FocusLine.interruptInfo(lineKey).trough;
      var pt = FocusLine.pointAt(lineKey, trough, BOX);
      g.appendChild(el('line', { x1: pt.x, y1: pt.y + 8, x2: pt.x, y2: pt.y + 30, stroke: '#FF5714', 'stroke-width': 1.2 }));
      g.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 4.2, fill: '#FF5714' }));
      g.appendChild(el('circle', { cx: pt.x, cy: pt.y, r: 1.8, fill: '#F3F2EE' }));
      var lab = el('text', { x: pt.x, y: pt.y + 44, fill: '#FF5714', 'font-family': 'IBM Plex Mono', 'font-size': 8, 'letter-spacing': 1.4, 'text-anchor': 'middle' });
      lab.textContent = 'INTERRUPTION'; g.appendChild(lab);
      var hi = el('text', { x: BOX.x + BOX.w, y: BOX.y - 6, fill: '#7A7873', 'font-family': 'IBM Plex Mono', 'font-size': 7.5, 'letter-spacing': 1.2, 'text-anchor': 'end' });
      hi.textContent = 'HIGH · FOR YOU'; g.appendChild(hi);

      document.getElementById('slot-archetype').textContent = name;
      if (data && data.date) document.getElementById('slot-date').textContent = data.date;
      var cap = document.getElementById('slot-caption');
      cap.innerHTML = caption.map(function (line, i) {
        return '<tspan x="35" dy="' + (i === 0 ? 0 : 23) + '">' + line + '</tspan>';
      }).join('');
      // signal readiness only once the webfonts are in — font-display:swap could
      // otherwise let the PDF capture fallback faces (outputs render waits on this)
      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () { document.body.setAttribute('data-rendered', '1'); });
    }

    // real data arrives via ?d= (small payloads) or is injected after load
    // through window.__setData (?wait=1 — long sessions outgrow the URL)
    window.__setData = function (data) { render((data && data.arch) || 'deep', data); };
    var params = new URLSearchParams(location.search);
    var q = params.get('d');
    // A malformed payload must NOT fall back to the synthetic preview: that
    // printed an invented session — someone else's line and caption — and still
    // flagged itself rendered, so the guest was handed a fabricated card. Fail
    // visibly instead and never set data-rendered, which halts the print.
    if (q) {
      try { var data = JSON.parse(decodeURIComponent(escape(atob(q)))); render(data.arch || 'deep', data); }
      catch (e) { document.body.setAttribute('data-render-error', String(e && e.message || e)); }
    } else if (!params.get('wait')) {
      // no data at all → the standalone design preview (never the print path,
      // which always passes ?d= or ?wait=1)
      render('deep');
    }
    var sel = document.getElementById('selArch'); if (sel) sel.onchange = function (e) { render(e.target.value); };
  })();
  </script>
</body>
</html>
