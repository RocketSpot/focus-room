<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* every surface reports its own JS errors into the room's diagnostic trail */
(function(){var er=function(p){try{p.page=location.pathname;navigator.sendBeacon('/client-error',JSON.stringify(p))}catch(e){}};
window.addEventListener('error',function(e){er({kind:'error',msg:String(e.message||e),src:String(e.filename||''),line:e.lineno||0})});
window.addEventListener('unhandledrejection',function(e){er({kind:'unhandledrejection',msg:String((e.reason&&e.reason.message)||e.reason)})});
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Focus Room, TV · Signal</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--font-sans); }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #tv {
    position: relative; width: 1920px; height: 1080px; flex: none; transform-origin: center center;
    background:
      radial-gradient(120% 90% at 50% 118%, rgba(221,202,142,0.05), transparent 60%),
      radial-gradient(140% 120% at 50% 50%, #141414 0%, #0B0B0A 70%, #060605 100%);
    overflow: hidden;
  }
  .glow { position: absolute; border-radius: 50%; filter: var(--blur-glow); pointer-events: none; will-change: transform; }
  .glow.a { width: 1100px; height: 700px; left: 50%; bottom: -360px; transform: translateX(-50%); background: rgba(221,202,142,0.08); }
  .glow.b { width: 700px; height: 500px; left: 10%; top: 30%; background: var(--c-signal-faint); }
  .corner { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--dot); opacity: 0.18; }

  .head { position: absolute; top: 72px; left: 120px; right: 120px; display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand .mark { width: 13px; height: 13px; border-radius: 50%; background: var(--c-signal); box-shadow: 0 0 22px 2px rgba(221,202,142,0.5); }
  .brand .label { color: var(--fg-muted); font-size: 17px; letter-spacing: var(--tr-mono); }
  .live { display: flex; align-items: center; gap: 14px; color: var(--fg-muted); font-size: 17px; letter-spacing: var(--tr-mono); }
  .live .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--c-signal); box-shadow: 0 0 16px 2px var(--c-signal-glow); animation: breathe 5.6s var(--ease-in-out) infinite; }
  @keyframes breathe { 0%,100% { opacity: 0.95; } 50% { opacity: 0.5; } }

  /* amber (never orange) SIMULATED badge, persistent whenever the source is sim */
  #simBadge { position: absolute; top: 66px; left: 50%; transform: translateX(-50%); display: none;
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #E0A657; border: 1px solid rgba(224,166,87,0.55); border-radius: 6px; padding: 7px 14px;
    background: rgba(224,166,87,0.06); }
  #simBadge.on { display: block; }

  /* STAFF MODE indicator, shown whenever engineering access is unlocked. Distinct
     from the amber SIMULATED badge (this is teal) so the two never read as one. */
  #staffBadge { position: absolute; top: 112px; right: 120px; display: none;
    font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #5AC8C0; border: 1px solid rgba(90,200,192,0.55); border-radius: 6px; padding: 6px 12px;
    background: rgba(90,200,192,0.06); }
  #staffBadge.on { display: block; }

  .state { position: absolute; left: 120px; top: 146px; }
  .state .word { font-family: var(--font-display); font-weight: 400; font-size: 76px; line-height: 1; letter-spacing: -0.03em; color: var(--fg);
    transition: opacity 620ms var(--ease-in-out), transform 620ms var(--ease-in-out); }
  .state.swap .word { opacity: 0; transform: translateY(14px); }
  .state .sub { margin-top: 14px; font-family: var(--font-mono); font-size: 16px; letter-spacing: var(--tr-mono-sm); text-transform: uppercase; color: var(--fg-faint); }

  /* the live scope canvas fills the plot region */
  #scope { position: absolute; left: 120px; top: 300px; width: 1680px; height: 560px; }
  /* per-ear trace labels + the honest amplitude note */
  .earLabel { position: absolute; font-family: var(--font-mono); font-size: 20px; letter-spacing: var(--tr-mono); color: var(--fg-muted);
    text-shadow: 0 0 10px #060605, 0 0 10px #060605, 0 0 6px #060605; }
  #labL { left: 120px; top: 312px; display: none; }
  #labR { left: 120px; top: 592px; display: none; }
  .earState { position: absolute; font-family: var(--font-mono); font-size: 13px; letter-spacing: var(--tr-mono-sm); text-transform: uppercase; color: var(--fg-faint);
    text-shadow: 0 0 10px #060605, 0 0 10px #060605, 0 0 6px #060605; }
  #stL { left: 120px; top: 340px; display: none; }
  #stR { left: 120px; top: 620px; display: none; }
  .caption { position: absolute; left: 120px; bottom: 60px; color: var(--fg-muted); font-size: 16px; letter-spacing: var(--tr-mono); font-family: var(--font-mono); text-transform: uppercase; }
  .caption .dim { color: var(--fg-faint); }

  /* engineering overlay, all four transmitted channels + quality; toggled with 'e' */
  #eng { position: absolute; left: 120px; right: 120px; top: 916px; display: none; font-family: var(--font-mono);
    font-size: 13px; letter-spacing: var(--tr-mono-sm); color: var(--fg-faint); text-transform: uppercase; line-height: 1.7; }
  #eng.on { display: block; }
  #eng b { color: var(--fg-muted); font-weight: 400; }
  #eng .warn { color: #E0A657; }
  #eng .bad { color: var(--w-gamma); }
  /* the one condition the room names: the earbuds fully lost their link.
     A quiet card, not a takeover; the iPad carries the full instruction. */
  #linklost { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%);
    display: none; align-items: center; gap: 14px; padding: 14px 26px;
    font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #E0A657; border: 1px solid rgba(224,166,87,0.5);
    border-radius: 8px; background: rgba(6,6,5,0.82); z-index: 60; }
  #linklost.on { display: flex; }
  #linklost .pip { width: 9px; height: 9px; border-radius: 50%; background: #E0A657;
    animation: breathe 1.8s var(--ease-in-out) infinite; }
</style>
</head>
<body>
  <div id="stage">
    <div id="tv">
      <div id="linklost"><span class="pip"></span><span>Earbuds disconnected · session held</span></div>

      <div class="glow a" id="glowA"></div>
      <div class="glow b" id="glowB"></div>

      <div class="head">
        <div class="brand"><span class="mark"></span><span class="label">ZONE, THE FOCUS ROOM</span></div>
        <div class="live"><span class="pip"></span><span>LIVE</span></div>
      </div>
      <div id="simBadge">Simulated data</div>
      <div id="staffBadge">Staff mode · engineering</div>

      <div class="state" id="stateWrap"><div class="word" id="stateWord"></div><div class="sub" id="stateSub"></div></div>

      <canvas id="scope"></canvas>
      <div class="earLabel" id="labL">L</div><div class="earState" id="stL"></div>
      <div class="earLabel" id="labR">R</div><div class="earState" id="stR"></div>

      <div class="caption" id="caption">Live from your earbuds</div>
      <div id="eng"></div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    // ============================================================
    // The live signal check. ACTUAL raw EEG samples (eeg/raw-v1) from the guest's
    // earbuds, decomposed into the five rhythms the room names everywhere else, so
    // the screen shows what an EEG trace really looks like: delta rolling slowly,
    // alpha a clean rhythm, gamma fast and fine.
    //
    // This replaces a single wideband trace per ear. That version had no mains
    // notch at all, so 50/60 Hz hum passed at only 5 to 8 dB down and drew as a
    // four-pixel zigzag, and its high-pass was primed backwards so every gap
    // planted a full-height spike. Those two things were the spikes.
    //
    // Rules unchanged: straight segments between real samples, no splines, no
    // invented noise, gaps stay visible and are never bridged, causal filters
    // only, no µV labels (calibration deliberately unverified). All four
    // transmitted channels remain available in the staff engineering view.
    // ============================================================
    var tv = document.getElementById('tv');
    function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); tv.style.transform = 'scale(' + s + ')'; }
    window.addEventListener('resize', fit); fit();

    // ---- provisional config (overwritten by eeg/config-v1) ----
    var LABELS = ['Left-A', 'Left-B', 'Right-A', 'Right-B'];
    var CFG = { expectedRate: 250, simulation: false, calibrationStatus: 'unverified', mapping: 'provisional' };

    // ---- display filter (PROVISIONAL, causal, per-channel) --------------------
    // A causal high-pass (~1 Hz, removes DC/drift) then low-pass (~40 Hz), RBJ
    // biquads in Transposed Direct Form II with per-channel persistent state, so
    // successive small batches filter continuously. never a zero-phase or centered pass.
    // Values are provisional; the 0.5–40 vs 30–45 gamma inconsistency is logged as
    // DSP tech-debt for the canonical phase. Raw samples are kept untouched.
    var FILTER = { hpHz: 1.0, lpHz: 40.0, q: 0.707, resetGapSamples: 125 /* ~0.5 s */ };
    function biquad(kind, f0, q, fs) {
      var w0 = 2 * Math.PI * f0 / fs, c = Math.cos(w0), s = Math.sin(w0), al = s / (2 * q), b0, b1, b2, a0, a1, a2;
      if (kind === 'hp') { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2; }
      else { b0 = (1 - c) / 2; b1 = 1 - c; b2 = (1 - c) / 2; }
      a0 = 1 + al; a1 = -2 * c; a2 = 1 - al;
      return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0, z1: 0, z2: 0 };
    }
    function biquadReset(bq) { bq.z1 = 0; bq.z2 = 0; }
    function biquadStep(bq, x) {              // TDF-II, causal
      if (!isFinite(x)) { return NaN; }
      var y = bq.b0 * x + bq.z1;
      bq.z1 = bq.b1 * x - bq.a1 * y + bq.z2;
      bq.z2 = bq.b2 * x - bq.a2 * y;
      return y;
    }
    function makeChannelFilter() {
      var fs = CFG.expectedRate;
      return { hp: biquad('hp', FILTER.hpHz, FILTER.q, fs), lp: biquad('lp', FILTER.lpHz, FILTER.q, fs), primed: false };
    }
    function filtStep(cf, x) {
      if (!cf.primed && isFinite(x)) {
        // Prime BOTH filters to their DC steady state for this first sample, so
        // neither emits a startup transient.
        //
        // The high-pass used to be primed by zeroing its state, with a comment
        // claiming that gave a near-zero transient. It gave the opposite: for
        // transposed-direct-form-II, y = b0*x + z1, so zeroed state emits
        // y0 = b0*x, i.e. essentially the WHOLE raw DC offset of the channel, and
        // an ADC offset is thousands of counts against a signal of order tens. It
        // then decayed over the high-pass time constant, so every stream start,
        // every config message, every reset and every transport gap of half a
        // second or more planted a full-height spike that sat in the window for
        // the next seven seconds. Being a median, the gain never compressed it.
        //
        // Solving y = 0 in steady state gives z1 = -b0*x and z2 = b2*x, which for
        // a high-pass (where b0 = b2 and b0 + b1 + b2 = 0) is stationary.
        cf.hp.z1 = -cf.hp.b0 * x; cf.hp.z2 = cf.hp.b0 * x;
        // The low-pass sits AFTER the high-pass, so its input starts at zero, not
        // at the raw sample. Priming it for a DC of x, as the old code did, made
        // it emit x on the very first step even once the high-pass was correct:
        // it was primed to pass a level it was never going to be handed.
        cf.lp.z1 = 0; cf.lp.z2 = 0;
        cf.primed = true;
      }
      return biquadStep(cf.lp, biquadStep(cf.hp, x));
    }

    // ---- the five rhythms, decomposed from ONE channel -------------------------
    // The guest sees the same signal split into the five bands the room talks
    // about everywhere else, which is what an EEG trace actually looks like:
    // delta rolling slowly, alpha a clean rhythm, gamma fast and fine.
    //
    // Two band-pass biquads are cascaded per band for a steeper skirt, so the
    // lanes are genuinely separated rather than five views of the same wobble.
    var BAND_DEF = [
      { k: 'delta', gl: 'δ', nm: 'Delta', ds: 'slow waves',        lo: 2,  hi: 4,  col: '#9D93D6' },
      { k: 'theta', gl: 'θ', nm: 'Theta', ds: 'internal thinking', lo: 4,  hi: 8,  col: '#4FA69A' },
      { k: 'alpha', gl: 'α', nm: 'Alpha', ds: 'relaxed alertness', lo: 8,  hi: 13, col: '#8CB16A' },
      { k: 'beta',  gl: 'β', nm: 'Beta',  ds: 'focused thinking',  lo: 13, hi: 30, col: '#DDCA8E' },
      { k: 'gamma', gl: 'γ', nm: 'Gamma', ds: 'peak processing',   lo: 30, hi: 45, col: '#E0A657' },
    ];
    // Mains hum is the single biggest reason the old trace looked nothing like
    // EEG. There was no notch at all, and a lone second-order 40 Hz low-pass is
    // only 5.4 dB down at 50 Hz and 7.8 dB at 60, so hum passed essentially
    // intact and drew as a four to five pixel zigzag at 250 Hz. On a marginal ear
    // contact it routinely exceeds the EEG itself.
    var NOTCH_HZ = [50, 60];
    function notchBiquad(f0, q, fs) {
      var w0 = 2 * Math.PI * f0 / fs, c = Math.cos(w0), s = Math.sin(w0), al = s / (2 * q);
      var b0 = 1, b1 = -2 * c, b2 = 1, a0 = 1 + al, a1 = -2 * c, a2 = 1 - al;
      return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0, z1: 0, z2: 0 };
    }
    function bpBiquad(lo, hi, fs) {
      var f0 = Math.sqrt(lo * hi), q = f0 / (hi - lo);
      var w0 = 2 * Math.PI * f0 / fs, c = Math.cos(w0), s = Math.sin(w0), al = s / (2 * q);
      var b0 = al, b1 = 0, b2 = -al, a0 = 1 + al, a1 = -2 * c, a2 = 1 - al;
      return { b0: b0 / a0, b1: b1 / a0, b2: b2 / a0, a1: a1 / a0, a2: a2 / a0, z1: 0, z2: 0 };
    }
    // Decompose the visible window of one channel. Runs from a PRE-ROLL before the
    // left edge so each causal filter has settled by the time the drawn part
    // begins; nothing invented, just samples we already have, filtered earlier.
    var PREROLL = 400;   // 1.6 s at 250 Hz
    function decompose(ch, leftIdx, rightIdx, fs) {
      var startIdx = leftIdx - PREROLL;
      var n = rightIdx - startIdx + 1;
      if (n < 8) return null;
      var lanes = BAND_DEF.map(function () { return { x: [], y: [] }; });
      var nf = NOTCH_HZ.map(function (f) { return notchBiquad(f, 24, fs); });
      var bp = BAND_DEF.map(function (b) { return [bpBiquad(b.lo, b.hi, fs), bpBiquad(b.lo, b.hi, fs)]; });
      // walk the ring oldest-to-newest across the requested span
      var order = [];
      for (var s = count - 1; s >= 0; s--) {
        var slot = (head - 1 - s + CAP) % CAP;
        var gi = idxRing[slot];
        if (gi < startIdx || gi > rightIdx) continue;
        order.push(slot);
      }
      var primed = false, dc = 0;
      for (var i = 0; i < order.length; i++) {
        var sl = order[i];
        if (!presentRing[ch][sl]) { continue; }        // a real gap stays a real gap
        var v = rawRing[ch][sl];
        if (!isFinite(v)) continue;
        if (!primed) { dc = v; primed = true; }
        var u = v - dc;                                 // remove the channel's offset once
        for (var q2 = 0; q2 < nf.length; q2++) u = biquadStep(nf[q2], u);
        for (var b = 0; b < BAND_DEF.length; b++) {
          var w = biquadStep(bp[b][0], u);
          w = biquadStep(bp[b][1], w);
          if (idxRing[sl] >= leftIdx) { lanes[b].x.push(idxRing[sl]); lanes[b].y.push(w); }
        }
      }
      return lanes[0].x.length >= 8 ? lanes : null;
    }
    function filtReset(cf) { biquadReset(cf.hp); biquadReset(cf.lp); cf.primed = false; }

    // ---- ring buffers (one shared index ring + per-channel raw & filtered) ----
    var CAP = 6000;                            // ~24 s at 250 Hz, plenty over the 8 s window
    var idxRing = new Float64Array(CAP);       // global sample index per slot
    var rawRing = [new Float32Array(CAP), new Float32Array(CAP), new Float32Array(CAP), new Float32Array(CAP)];
    var filtRing = [new Float32Array(CAP), new Float32Array(CAP), new Float32Array(CAP), new Float32Array(CAP)];
    var presentRing = [new Uint8Array(CAP), new Uint8Array(CAP), new Uint8Array(CAP), new Uint8Array(CAP)];
    var head = 0, count = 0, lastIndex = -1;
    var cf = [makeChannelFilter(), makeChannelFilter(), makeChannelFilter(), makeChannelFilter()];
    var haveData = false;
    // browser-transport continuity (distinct from device/SDK continuity) + an explicit
    // dropped-DISPLAY-batch counter. A dropped display batch is a browser/transport drop,
    // NEVER reported as device packet loss. The ring buffer is fixed-size (bounded memory).
    var lastSeq = 0, droppedDisplayBatches = 0;

    function pushSampleRow(gi, rowRaw, rowPresent) {
      idxRing[head] = gi;
      for (var ch = 0; ch < 4; ch++) {
        if (rowPresent[ch]) {
          var xv = rowRaw[ch];
          rawRing[ch][head] = xv;
          filtRing[ch][head] = filtStep(cf[ch], xv);
          presentRing[ch][head] = 1;
        } else {
          rawRing[ch][head] = NaN; filtRing[ch][head] = NaN; presentRing[ch][head] = 0;
        }
      }
      head = (head + 1) % CAP; if (count < CAP) count++; lastIndex = gi;
    }

    function onRaw(m) {
      // browser-transport continuity: drop a duplicate / out-of-order batch (a DISPLAY
      // drop, never called device packet loss). The ring is fixed-size (bounded memory).
      var seq = m.sequenceNumber || 0;
      if (seq && seq <= lastSeq) { droppedDisplayBatches++; return; }
      lastSeq = seq;
      haveData = true;
      var labels = m.channelLabels || LABELS;
      var samples = m.samples || [];
      var first = m.firstSampleIndex, n = m.sampleCount || 0;
      // gap → reset each channel's causal filter so it does not ring across the hole
      var cont = m.continuity || {};
      var gap = cont.sdkCallbackGapEstimate || (lastIndex >= 0 && first > lastIndex + 1);
      var missing = cont.estimatedMissingSamples || (first - lastIndex - 1);
      if (gap && missing >= FILTER.resetGapSamples) { for (var c = 0; c < 4; c++) filtReset(cf[c]); }
      // map incoming (label-ordered) channels onto our fixed [LA,LB,RA,RB] slots
      var colOf = {}; for (var li = 0; li < labels.length; li++) colOf[labels[li]] = li;
      for (var i = 0; i < n; i++) {
        var rowRaw = [NaN, NaN, NaN, NaN], rowPres = [0, 0, 0, 0];
        for (var ch = 0; ch < 4; ch++) {
          var col = colOf[LABELS[ch]];
          var arr = (col != null) ? samples[col] : null;
          if (arr && arr[i] != null && isFinite(arr[i])) { rowRaw[ch] = arr[i]; rowPres[ch] = 1; }
        }
        pushSampleRow(first + i, rowRaw, rowPres);
      }
    }

    // ---- quality → channel selection (NO guest-facing signal state) ----
    // The room NEVER tells a guest the state of their signal. No "clear / received /
    // limited / poor", no "reseat that side", no "settling", no per-channel reasons,
    // judging someone's signal at them is not the experience, and the guest can do
    // nothing useful with it. The heading is a CONSTANT welcome; the waveform speaks
    // for itself. Quality still arrives and still drives channel selection + the
    // engineering view + the operator's coaching prompt, it just never reaches the wall.
    var QUAL = null, selL = 'Left-A', selR = 'Right-A', selSwitchL = null, selSwitchR = null;
    var GUEST_WORD = 'This is you', GUEST_SUB = 'live from your earbuds';
    function onQuality(m) {
      QUAL = m;
      var sel = m.selectedConsumerChannels || {};
      // record channel switches so the renderer can BREAK the trace at the switch
      // point (a channel change must never read as a biological transition).
      if (sel.switched && sel.switched.left && sel.left && sel.left !== selL) selSwitchL = lastIndex;
      if (sel.switched && sel.switched.right && sel.right && sel.right !== selR) selSwitchR = lastIndex;
      selL = sel.left || selL;
      selR = sel.right || selR;
      updateEarStates();
    }
    // Engineering-only per-channel state, rendered ONLY in staff mode, never for a guest.
    function chanState(ch) {
      if (!QUAL || !QUAL.channels || !QUAL.channels[ch]) return '';
      var q = QUAL.channels[ch];
      if (!q.present) return 'unavailable';
      if (q.eligible) return 'clean';
      var r = (q.reasons || []).filter(function (x) { return x !== 'stabilising'; });
      return r.length ? r.join(' · ') : 'settling';
    }
    function updateEarStates() {
      // Guest: a bare L / R. Staff: the selected channel + its engineering state.
      var staff = (typeof staffMode !== 'undefined') && staffMode;
      document.getElementById('labL').textContent = 'L' + (staff && selL ? '  ·  ' + selL : '');
      document.getElementById('labR').textContent = 'R' + (staff && selR ? '  ·  ' + selR : '');
      document.getElementById('stL').textContent = staff ? (selL ? chanState(selL) : 'no usable channel') : '';
      document.getElementById('stR').textContent = staff ? (selR ? chanState(selR) : 'no usable channel') : '';
    }

    // ---- big status word (keeps the existing swap animation) ----
    var curWord = null, wordTimer = null;
    function setWord(w) {
      if (w === curWord) return; curWord = w;
      var wrap = document.getElementById('stateWrap'); wrap.classList.add('swap');
      clearTimeout(wordTimer);
      wordTimer = setTimeout(function () { document.getElementById('stateWord').textContent = w || ''; wrap.classList.remove('swap'); }, 620);
    }
    function setSub(s) { document.getElementById('stateSub').textContent = s || ''; }

    // ---- canvas scope --------------------------------------------------------
    var WINDOW_S = 7;                          // rolling seconds shown
    var canvas = document.getElementById('scope'), ctx = canvas.getContext('2d');
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    var CW = 1680, CH = 560;                    // layout px (TV coords)
    function sizeCanvas() { canvas.width = CW * DPR; canvas.height = CH * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
    sizeCanvas();

    var GAIN_FLOOR = 40;                        // ADC counts, don't over-amplify a quiet trace
    var gainShared = null;                      // px per count, smoothed (attack/release)
    var engOn = false;

    function robustAmp(ch, leftIdx) {           // ~1.4826·MAD of |filtered| in window (counts)
      var vals = [];
      for (var s = 0; s < count; s++) {
        var slot = (head - 1 - s + CAP) % CAP;
        if (idxRing[slot] < leftIdx) break;
        if (presentRing[ch][slot]) { var v = filtRing[ch][slot]; if (isFinite(v)) vals.push(Math.abs(v)); }
      }
      if (vals.length < 8) return null;
      vals.sort(function (a, b) { return a - b; });
      return 1.4826 * vals[Math.floor(vals.length * 0.5)];  // MAD-ish robust amplitude
    }

    // draw one trace into [yTop,yBot] using min-max decimation per pixel column;
    // straight segments; breaks across gaps; never interpolates across missing data.
    function drawTrace(ch, x0, wpx, yTop, yBot, leftIdx, rightIdx, gain, color, breakIdx) {
      var yc = (yTop + yBot) / 2, span = rightIdx - leftIdx || 1;
      // faint centerline
      ctx.strokeStyle = 'rgba(214,212,201,0.10)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, yc); ctx.lineTo(x0 + wpx, yc); ctx.stroke();
      // channel-switch column: the trace must BREAK here (a channel change is not a
      // biological transition) and a marker drawn so the switch is visible.
      var breakPx = (breakIdx != null && breakIdx >= leftIdx && breakIdx <= rightIdx)
        ? Math.floor(((breakIdx - leftIdx) / span) * (wpx - 1)) : -1;
      // bucket samples into pixel columns
      var cols = new Array(wpx); // each: {min,max,last,idx} or undefined (gap)
      for (var s = 0; s < count; s++) {
        var slot = (head - 1 - s + CAP) % CAP, gi = idxRing[slot];
        if (gi < leftIdx) break;
        if (!presentRing[ch][slot]) continue;
        var v = filtRing[ch][slot]; if (!isFinite(v)) continue;
        var px = Math.floor(((gi - leftIdx) / span) * (wpx - 1));
        if (px < 0 || px >= wpx) continue;
        var col = cols[px];
        if (!col) cols[px] = { min: v, max: v, last: v, idx: gi };
        else { if (v < col.min) col.min = v; if (v > col.max) col.max = v; col.last = v; col.idx = gi; }
      }
      // SOFT LIMIT, never a hard clamp. Clamping pinned every large artifact (a blink,
      // an electrode step, a bud being touched) flat against the panel edge and drew it
      // as a FLAT-TOPPED SQUARE, a shape the signal never made. Instead the drawn
      // offset stays linear (honest 1:1) inside the knee and compresses asymptotically
      // toward the edge beyond it, so a big excursion TAPERS and keeps its shape rather
      // than railing. Monotonic, continuous, slope 1 at the knee: no sample is dropped,
      // nothing is hidden, and the compression only ever affects how far it is drawn.
      var half = Math.max(1, (yBot - yTop) / 2 - 2), knee = half * 0.68;
      var room = Math.max(1e-6, half - knee);
      var yOf = function (v) {
        var d = v * gain, a = Math.abs(d);
        if (a > knee) d = (d < 0 ? -1 : 1) * (knee + room * (1 - Math.exp(-(a - knee) / room)));
        return yc - d;
      };
      // connect column representatives with straight segments; break on gaps
      ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      var penDown = false, prevPx = -99;
      for (var p = 0; p < wpx; p++) {
        var cc = cols[p];
        if (!cc) { penDown = false; continue; }         // no sample this column → break
        var gapCols = p - prevPx;
        var xpix = x0 + p;
        if (breakPx >= 0 && prevPx < breakPx && p >= breakPx) penDown = false;   // break at the channel switch
        if (!penDown || gapCols > 2) { ctx.moveTo(xpix, yOf(cc.last)); penDown = true; }
        else {
          // draw the min–max extent so brief spikes survive decimation
          if (cc.max - cc.min > 1e-6) { ctx.lineTo(xpix, yOf(cc.max)); ctx.lineTo(xpix, yOf(cc.min)); }
          ctx.lineTo(xpix, yOf(cc.last));
        }
        prevPx = p;
      }
      ctx.stroke();
      // soft glow pass
      ctx.strokeStyle = color; ctx.globalAlpha = 0.18; ctx.lineWidth = 7; ctx.stroke(); ctx.globalAlpha = 1;
      // draw the switch marker (amber dashed vertical) so a channel change is obvious
      if (breakPx >= 0) {
        ctx.strokeStyle = '#E0A657'; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]);
        ctx.beginPath(); ctx.moveTo(x0 + breakPx, yTop); ctx.lineTo(x0 + breakPx, yBot); ctx.stroke();
        ctx.setLineDash([]); ctx.globalAlpha = 1;
      }
    }

    // ---- one rhythm's lane ----------------------------------------------------
    // Each band is scaled to ITS OWN amplitude, because band power falls steeply
    // with frequency: at a shared gain, delta would fill the panel and gamma
    // would be a flat line. This is the same convention every clinical band
    // display uses. The gain is smoothed slowly and per band, so a lane settles
    // rather than pumping, and it is only ever how far the trace is drawn, never
    // which samples get drawn.
    var laneGain = {};
    function drawLane(def, lane, yTop, yBot, leftIdx, rightIdx) {
      var yc = (yTop + yBot) / 2, half = Math.max(6, (yBot - yTop) / 2 - 4);
      var ys = lane.y, xs = lane.x;
      var absv = [];
      for (var i = 0; i < ys.length; i++) { var a = Math.abs(ys[i]); if (isFinite(a)) absv.push(a); }
      absv.sort(function (p, q) { return p - q; });
      var amp = absv.length ? 1.4826 * absv[Math.floor(absv.length * 0.5)] : 0;
      var target = amp > 1e-6 ? (half * 0.62) / amp : 0;
      var g = laneGain[def.k];
      laneGain[def.k] = (g == null) ? target : g + (target - g) * (target < g ? 0.06 : 0.02);
      var gain = laneGain[def.k] || 0;

      // label: the glyph, the name, and the plain words the room uses everywhere
      ctx.fillStyle = def.col; ctx.globalAlpha = 0.9;
      ctx.font = '26px "PP Neue Montreal", "Space Grotesk", Helvetica, Arial, sans-serif';
      ctx.fillText(def.gl, 6, yc + 8);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(214,212,201,0.72)';
      ctx.font = '15px "IBM Plex Mono", monospace';
      ctx.fillText(def.nm.toUpperCase(), 40, yc - 2);
      ctx.fillStyle = 'rgba(214,212,201,0.32)';
      ctx.font = '12px "IBM Plex Mono", monospace';
      ctx.fillText(def.ds.toUpperCase(), 40, yc + 15);

      var x0 = 150, wpx = CW - x0 - 10, span = Math.max(1, rightIdx - leftIdx);
      ctx.beginPath();
      var pen = false, prevPx = -99;
      for (var j = 0; j < xs.length; j++) {
        var px = x0 + ((xs[j] - leftIdx) / span) * wpx;
        var py = yc - Math.max(-half, Math.min(half, ys[j] * gain));
        // a real gap in the samples stays a real gap on the screen, never bridged
        if (!pen || px - prevPx > 6) { ctx.moveTo(px, py); pen = true; } else { ctx.lineTo(px, py); }
        prevPx = px;
      }
      // literal colour. This used to pass 'var(--c-signal)' straight to
      // ctx.strokeStyle, which Canvas 2D cannot resolve: assigning an unparseable
      // value is a silent no-op, so the previous value persisted, and the previous
      // value was the faint centreline grey. The left ear and every engineering
      // trace had been drawing at 10% opacity.
      ctx.strokeStyle = def.col; ctx.lineWidth = 1.9;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.stroke();
      ctx.globalAlpha = 0.16; ctx.lineWidth = 6; ctx.stroke(); ctx.globalAlpha = 1;
    }

    function drawUnavailable(yTop, yBot, text) {
      var yc = (yTop + yBot) / 2;
      ctx.strokeStyle = 'rgba(214,212,201,0.10)'; ctx.setLineDash([2, 12]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, yc); ctx.lineTo(CW, yc); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(214,212,201,0.28)'; ctx.font = '18px "IBM Plex Mono", monospace';
      ctx.fillText(text, 16, yc - 8);
    }

    function render() {
      ctx.clearRect(0, 0, CW, CH);
      if (!haveData || count < 2) { requestAnimationFrame(render); return; }
      var rightIdx = lastIndex, leftIdx = rightIdx - Math.round(WINDOW_S * CFG.expectedRate);

      if (!engOn) {
        // --- the five rhythms, one signal decomposed ---
        // A single channel split into the five bands the room names everywhere
        // else. One channel, not an average: the two buds do not share a sample
        // clock, so averaging them in the time domain assumes an alignment that
        // does not exist.
        var la = selL ? { 'Left-A': 0, 'Left-B': 1 }[selL] : null;
        var ra = selR ? { 'Right-A': 2, 'Right-B': 3 }[selR] : null;
        var src = null;
        if (la != null && robustAmp(la, leftIdx) != null) src = la;
        else if (ra != null && robustAmp(ra, leftIdx) != null) src = ra;
        else { for (var c3 = 0; c3 < 4; c3++) { if (robustAmp(c3, leftIdx) != null) { src = c3; break; } } }
        var lanes = (src != null) ? decompose(src, leftIdx, rightIdx, CFG.expectedRate) : null;
        if (!lanes) {
          drawUnavailable(20, 540, '');
        } else {
          var laneH = Math.floor(CH / BAND_DEF.length);
          for (var b2 = 0; b2 < BAND_DEF.length; b2++) {
            var top = b2 * laneH, bot = top + laneH - 10;
            drawLane(BAND_DEF[b2], lanes[b2], top, bot, leftIdx, rightIdx);
          }
        }
      } else {
        // --- engineering: all four transmitted channels, same time axis ---
        var order = [0, 1, 2, 3], amps = [];
        for (var k = 0; k < 4; k++) amps.push(robustAmp(k, leftIdx) || GAIN_FLOOR);
        // same scaling logic as the consumer lanes, for the shorter engineering lane
        // (half ≈ 57px): 1 SD at ~13px keeps a ~3 SD swing inside the soft knee.
        var gEng = (CH * 0.024) / Math.max.apply(null, amps.concat([GAIN_FLOOR]));
        for (var q = 0; q < 4; q++) {
          var yt = 10 + q * 138, yb = yt + 118;
          var anyPresent = false;
          for (var s2 = 0; s2 < Math.min(count, 400); s2++) { var sl = (head - 1 - s2 + CAP) % CAP; if (presentRing[q][sl]) { anyPresent = true; break; } }
          ctx.fillStyle = 'rgba(214,212,201,0.5)'; ctx.font = '15px "IBM Plex Mono", monospace';
          ctx.fillText(LABELS[q], 8, yt + 16);
          if (anyPresent) drawTrace(q, 0, CW, yt, yb, leftIdx, rightIdx, gEng, '#DDCA8E');
          else drawUnavailable(yt, yb, LABELS[q] + ', absent');
        }
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
    setInterval(renderEng, 300);   // engineering text refresh (off the 60 fps loop)

    function renderEng() {
      var el = document.getElementById('eng');
      if (!engOn) { el.classList.remove('on'); return; }
      el.classList.add('on');
      if (!QUAL) { el.innerHTML = '<b>ENGINEERING</b>, waiting for quality…'; return; }
      var cq = QUAL.channels || {}, cc = QUAL.connectionQuality || {};
      function badge(ch) {
        var q = cq[ch]; if (!q) return ch + ':, ';
        if (!q.present) return '<span class="bad">' + ch + ':absent</span>';
        var flags = [];
        if (q.flatline) flags.push('flat'); if (q.clipping) flags.push('clip'); if (q.electrodeStep) flags.push('step');
        if (q.drift) flags.push('drift'); if (q.lineNoise) flags.push('50/60');
        var cls = q.eligible ? '' : (flags.length ? 'warn' : '');
        return '<span class="' + cls + '">' + ch + ' amp≈' + (q.robustAmplitudeCounts || 0) + 'ct'
          + (flags.length ? ' [' + flags.join(',') + ']' : ' ok') + '</span>';
      }
      var sel = QUAL.selectedConsumerChannels || {};
      el.innerHTML =
        '<b>ENGINEERING</b> · ingest ' + (cc.ingestThroughputSamplesPerSecond != null ? cc.ingestThroughputSamplesPerSecond + '/s' : ', ')
        + ' · cadence ' + (cc.callbackCadenceHz != null ? cc.callbackCadenceHz + 'Hz' : ', ')
        + ' · batch ' + (cc.meanSamplesPerCallback != null ? cc.meanSamplesPerCallback : ', ')
        + ' · exp ' + (cc.expectedHardwareSampleRateHz || CFG.expectedRate) + 'Hz · device-rate n/a (' + (cc.sampleRateConfidence || 'unverified') + ')'
        + ' · sel L=' + selL + '(' + ((sel.confidence || {}).left || ', ') + ') R=' + selR + '(' + ((sel.confidence || {}).right || ', ') + ')'
        + ' · idx ' + ((QUAL.packetContinuity || {}).localIndex || 0)
        + ' · dropped-display-batches ' + droppedDisplayBatches
        + ' · continuity ' + ((QUAL.packetContinuity || {}).continuityMethod || ', ') + '(' + ((QUAL.packetContinuity || {}).continuityConfidence || ', ') + ')'
        + ' · units UNVERIFIED (uncalibrated) · thresholds provisional · clear ' + (CFG.clearStateEnabled ? 'enabled' : 'GATED')
        + '<br>DEVICE SAMPLE CONTINUITY UNVERIFIED, firmware exposes no sample counter'
        + '<br>' + ['Left-A', 'Left-B', 'Right-A', 'Right-B'].map(badge).join(' &nbsp; ');
    }

    // ---- EEG message handling (shared by the IPC relay + the WS fallback) ----
    // Raw config/raw/quality normally arrive from the launcher's authenticated IPC relay (finding
    // #5). The same handler also runs for any WS-delivered eeg message (a future launcher-authorized
    // WebSocket client), the plain page socket never receives eeg types, so this is defensive.
    function handleEeg(m) {
      if (m.type === 'eeg/config-v1') {
        LABELS = m.channelLabels || LABELS;
        CFG.expectedRate = m.expectedHardwareSampleRateHz || m.expectedSampleRateHz || 250;
        CFG.simulation = !!m.simulation;
        CFG.calibrationStatus = m.calibrationStatus || 'unverified';
        CFG.mapping = m.channelMappingStatus || 'provisional';
        CFG.clearStateEnabled = !!m.clearStateEnabled;
        document.getElementById('simBadge').classList.toggle('on', CFG.simulation);
        cf = [makeChannelFilter(), makeChannelFilter(), makeChannelFilter(), makeChannelFilter()];
      } else if (m.type === 'eeg/raw-v1') {
        if (m.simulation) { CFG.simulation = true; document.getElementById('simBadge').classList.add('on'); }
        onRaw(m);
      } else if (m.type === 'eeg/quality-v1') {
        onQuality(m);
      }
    }

    // ---- WebSocket (NON-raw surface state only) ----
    function connectLive() {
      if (!location.host) { setWord(GUEST_WORD); setSub(GUEST_SUB); return; }
      var ws; try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); } catch (e) { return; }
      ws.onopen = function () {
        // This page's own WebSocket carries only NON-raw surface state (session/state). Raw EEG does
        // NOT travel over this socket (finding #5): it arrives via the launcher's authenticated IPC
        // relay (see subscribeRawEeg below). So this hello carries no capability and no token.
        ws.send(JSON.stringify({ type: 'client/hello', role: 'tv', t: Date.now() })); connectLive._n = 0;
      };
      ws.onmessage = function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.type === 'eeg/config-v1' || m.type === 'eeg/raw-v1' || m.type === 'eeg/quality-v1') { handleEeg(m); return; }
        if (m.type === 'session/state' && (window.dispatchEvent(new CustomEvent('focusroom:state', { detail: m })) || true)) { if (m.beat === 'idle' || m.beat === 'welcome') resetScope(); }
      };
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
      ws.onclose = function () { connectLive._n = (connectLive._n || 0) + 1; var b = Math.min(8000, 500 * Math.pow(2, Math.min(connectLive._n, 4))); setTimeout(connectLive, b + Math.random() * b * 0.4); };
    }

    function resetScope() {
      // clear every session-scoped buffer so no data survives across guests, and a
      // sim buffer can never mix into a real session (and vice versa).
      head = 0; count = 0; lastIndex = -1; haveData = false; gainShared = null; QUAL = null;
      lastSeq = 0; droppedDisplayBatches = 0; selSwitchL = null; selSwitchR = null;
      for (var i = 0; i < 4; i++) { rawRing[i].fill(0); filtRing[i].fill(0); presentRing[i].fill(0); }
      cf = [makeChannelFilter(), makeChannelFilter(), makeChannelFilter(), makeChannelFilter()];
      setWord(GUEST_WORD); setSub(GUEST_SUB); document.getElementById('stL').textContent = ''; document.getElementById('stR').textContent = '';
    }

    // ============================================================
    // Engineering-view ACCESS CONTROL (Phase 2A.2 correction 3 + pre-merge hardening)
    // ------------------------------------------------------------
    // The engineering view exposes all four raw channels + detailed quality. An ordinary
    // guest must NOT be able to open it. It is gated behind a build-level STAFF flag the
    // LAUNCHER provides (never a bare URL param a guest could type):
    //   • the launcher's preload reports staffUiEnabled, FALSE in production guest builds,
    //     so ?staff=1 / ?dev=1 do NOTHING there; TRUE only in a dev/staff build;
    //   • a LOCALLY CONFIGURED credential (FOCUSROOM_STAFF_TOKEN → the launcher-issued PIN)
    //     unlocks via 'S' + the credential. There is NO hardcoded PIN, and no launcher (a
    //     plain browser on the LAN) is LOCKED by default.
    // Access is logged locally (timestamp + action ONLY, never raw samples). Leaving staff
    // mode clears the engineering view + text and returns to the consumer view. This is an
    // operational gate, not a cryptographic control (a dev build's page-side flag), the real
    // production lock is the launcher withholding staffUiEnabled + the credential.
    var Q = new URLSearchParams(location.search);
    var STAFF_CFG = (window.__FOCUSROOM__ && window.__FOCUSROOM__.staff) || {};
    var STAFF_UI = STAFF_CFG.uiEnabled === true;      // launcher-gated; false in production guest builds
    var STAFF_PIN = String(STAFF_CFG.pin || '');      // locally configured credential; empty ⇒ PIN disabled
    // bare ?staff=1 / ?dev=1 activate ONLY when the build permits staff UI (never in guest builds);
    // a launcher-issued token (?staff=<credential>) unlocks when it matches the configured credential.
    var paramUnlock = STAFF_UI && (Q.get('staff') === '1' || Q.has('dev'));
    var tokenUnlock = STAFF_PIN !== '' && String(Q.get('staff') || '') === STAFF_PIN;
    var staffMode = paramUnlock || tokenUnlock;
    function engToggleAllowed() { return staffMode === true; }   // the single gate the 'E' key honours

    function logEngAccess(action, how) {
      // local access log, NO raw EEG, ever. Just who/when/how the eng view was used.
      var entry = { t: Date.now(), action: action, how: how || null, host: location.host || 'file' };
      try {
        var KEY = 'focusroom.eng.accessLog';
        var log = JSON.parse(localStorage.getItem(KEY) || '[]');
        if (!Array.isArray(log)) log = [];
        log.push(entry); if (log.length > 200) log = log.slice(-200);   // bounded; access events only
        localStorage.setItem(KEY, JSON.stringify(log));
      } catch (e) { /* localStorage may be unavailable on file://, access still works */ }
      // console records the ACCESS EVENT only (never raw channel values)
      try { console.info('[focusroom] engineering-view ' + action + (how ? ' (' + how + ')' : '')); } catch (e) {}
    }

    function setStaffMode(on, how) {
      if (on === staffMode) return;
      staffMode = !!on;
      document.getElementById('staffBadge').classList.toggle('on', staffMode);
      // the guest-facing surface carries NO signal state: entering staff mode reveals the
      // engineering caption + per-channel labels, leaving it takes them away again.
      try {
        document.getElementById('caption').innerHTML = captionFor(staffMode);
        updateEarStates();
      } catch (e) {}
      if (!staffMode) {
        // leaving staff mode: clear the engineering view + its rendered buffer and
        // return to the consumer view. (The shared signal rings keep feeding the
        // consumer L/R trace, only the engineering EXPOSURE is torn down.)
        engOn = false;
        var el = document.getElementById('eng'); el.classList.remove('on'); el.innerHTML = '';
        logEngAccess('staff-mode-off', how);
      } else {
        logEngAccess('staff-mode-on', how);
      }
    }
    if (staffMode) { document.getElementById('staffBadge').classList.add('on'); logEngAccess('staff-mode-on', 'launcher-param'); }

    document.addEventListener('keydown', function (e) {
      // 'E' toggles the engineering view, ONLY when staff/dev mode is unlocked.
      if (e.key === 'e' || e.key === 'E') {
        if (!engToggleAllowed()) return;              // ordinary guest: no engineering view
        engOn = !engOn;
        logEngAccess(engOn ? 'eng-view-open' : 'eng-view-close', 'keypress');
        return;
      }
      // 'S' opens the staff-credential prompt, ONLY in a staff build with a configured
      // credential. In production guest builds (STAFF_UI false) or when no credential is
      // configured (STAFF_PIN empty), it does nothing. A wrong/blank entry does nothing.
      if ((e.key === 's' || e.key === 'S') && !staffMode) {
        if (!STAFF_UI || STAFF_PIN === '') return;
        var pin = null;
        try { pin = window.prompt('Staff credential (engineering view):'); } catch (err) { pin = null; }
        if (pin != null && pin === STAFF_PIN) setStaffMode(true, 'pin');
        else if (pin != null) logEngAccess('staff-unlock-denied', 'pin');
        return;
      }
      // Escape leaves staff mode (and the engineering view with it).
      if (e.key === 'Escape' && staffMode) { setStaffMode(false, 'escape'); }
    });

    var positions = [[60, 60], [1860, 60], [60, 1020], [1860, 1020]];
    positions.forEach(function (pos) { var d = document.createElement('div'); d.className = 'corner'; d.style.left = pos[0] + 'px'; d.style.top = pos[1] + 'px'; tv.appendChild(d); });
    (function idleGlow() { var t = performance.now() / 1000;
      document.getElementById('glowA').style.transform = 'translateX(-50%) translate(' + (Math.sin(t / 9) * 16).toFixed(1) + 'px,' + (Math.cos(t / 11) * 10).toFixed(1) + 'px)';
      document.getElementById('glowB').style.transform = 'translate(' + (Math.cos(t / 13) * 18).toFixed(1) + 'px,' + (Math.sin(t / 10) * 12).toFixed(1) + 'px)';
      requestAnimationFrame(idleGlow); })();

    setWord(GUEST_WORD); setSub(GUEST_SUB);
    // Staff caption carries the engineering wording (relative display amplitude ·
    // uncalibrated); the guest just sees where it comes from, never a signal verdict.
    function captionFor(staff) {
      return staff ? 'Live signal from the earbud · <span class="dim">relative display amplitude · uncalibrated</span>'
                   : 'Live from your earbuds';
    }
    connectLive();

    // Raw EEG arrives via the launcher's authenticated IPC relay (finding #5), NOT this page's
    // WebSocket. Only the authorized Electron TV window has the preload bridge; a plain browser on
    // the LAN has no preload → no subscription → no raw. No token is ever exposed to this page.
    if (window.__FOCUSROOM__ && typeof window.__FOCUSROOM__.subscribeRawEeg === 'function') {
      window.__FOCUSROOM__.subscribeRawEeg(function (m) { handleEeg(m); });
    }

    // Test/ops hooks (onRaw/onQuality injection, reset, and the staff-mode + eng-view
    // toggles) are exposed ONLY in a dev/staff build (STAFF_UI). In a production guest build
    // they must NOT exist: setStaff() would otherwise flip staff mode with no gate, and
    // onRaw/onQuality would let a page-console attacker inject or read the raw scope. A plain
    // browser on the LAN (no launcher → STAFF_UI false) gets no __scope at all.
    if (STAFF_UI) {
      window.__scope = { onRaw: onRaw, onQuality: onQuality, reset: resetScope, state: function () {
        return { count: count, lastIndex: lastIndex, haveData: haveData, selL: selL, selR: selR,
          sim: CFG.simulation, clearStateEnabled: CFG.clearStateEnabled,
          droppedDisplayBatches: droppedDisplayBatches, lastSeq: lastSeq,
          selSwitchL: selSwitchL, selSwitchR: selSwitchR,
          staffMode: staffMode, engOn: engOn }; },
        pressE: function () { if (engToggleAllowed()) engOn = !engOn; return engOn; },
        setStaff: function (on) { setStaffMode(!!on, 'test'); return staffMode; } };
    }
    // a lightweight foreground fps sampler for the perf harness (visible pane only)
    window.__fps = { frames: 0, t0: 0, start: function () { this.frames = 0; this.t0 = performance.now(); },
      read: function () { return this.frames / Math.max(0.001, (performance.now() - this.t0) / 1000); } };
    (function fpsLoop() { window.__fps.frames++; requestAnimationFrame(fpsLoop); })();
  })();
  
    // the link-lost card rides canonical session state
    (function () {
      var el = document.getElementById('linklost');
      var orig = window.__onState__;
      window.addEventListener('focusroom:state', function (ev) {
        var m = ev.detail || {};
        if (el) el.classList.toggle('on', !!(m.link && m.link.lost));
      });
    }());
</script>
</body>
